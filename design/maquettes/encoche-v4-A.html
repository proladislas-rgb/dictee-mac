<!doctype html>
<!--
DIRECTION (piste A, « les ailes »)
Produit : la dictée d'un Mac, vue depuis l'encoche pendant que l'on parle.
Caractère : plat, large, mince ; rien ne descend, tout reste au niveau de la barre des menus.
Forme : l'encoche s'élargit de 180 à 320 px sans prendre un pixel de hauteur ; l'icône de l'app dans l'aile gauche, le son dans l'aile droite.
Texte : un ruban noir d'une ligne se détache 4 px sous l'encoche, les mots défilent vers la gauche, le dernier reste gris tant qu'il n'est pas sûr.
Mains libres : ✕ et ✓ aux deux bouts du ruban, ressort sobre (celui du panneau C), jouable avec F, Échap et Entrée.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictée, encoche A</title>
<style>
:root{
  --wall:#1b1c1e; --win:#262628; --bar:#151516;
  --k0:#000; --k2:#1b1b1d; --k3:#2a2a2d;
  --line:rgba(237,237,237,.08);
  --t1:#ededed; --t2:#a1a1a6; --t3:#85858b;
  --acc:#e4572e;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--wall);color:var(--t1);font:13px/16px var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;min-height:650px;min-width:1190px}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
::selection{background:rgba(237,237,237,.22)}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* bureau */
.stage{position:relative;width:100%;height:100%;overflow:hidden}
.menu{position:absolute;inset:0 0 auto 0;height:32px;background:var(--bar);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:var(--t2)}
.menu div{display:flex;gap:20px}.menu b{font-weight:600;color:var(--t1)}
.win{position:absolute;left:calc(50% - 380px);width:760px;top:140px;bottom:64px;background:var(--win);border-radius:10px;overflow:hidden}
.win i{position:absolute;top:12px;width:10px;height:10px;border-radius:50%;background:#3d3d40}
.win i:nth-child(1){left:12px}.win i:nth-child(2){left:28px}.win i:nth-child(3){left:44px}
.doc{position:absolute;left:32px;right:32px;top:56px;color:var(--t2);font-size:14px;line-height:22px;transition:opacity .25s ease}
.doc.off{opacity:0}
.doc h3{font-size:20px;line-height:28px;font-weight:600;color:var(--t1);margin-bottom:12px}
.doc p+p{margin-top:12px}
.doc .new{background:rgba(228,87,46,.2);border-radius:3px;transition:background-color 1.6s ease}
.doc .new.old{background:transparent}
.caret{display:inline-block;width:1.5px;height:16px;background:var(--t1);vertical-align:-3px;margin-left:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* l'encoche : toujours 32 px de haut */
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;width:180px;height:32px}
.notch::before,.notch::after{content:"";position:absolute;top:0;width:8px;height:8px;opacity:var(--sh,0)}
.notch::before{left:-8px;background:radial-gradient(circle at 0 100%,transparent 7.5px,#000 8px)}
.notch::after{right:-8px;background:radial-gradient(circle at 100% 100%,transparent 7.5px,#000 8px)}
.clip{position:absolute;inset:0;background:var(--k0);overflow:hidden;border-radius:0 0 10px 10px}
.wl,.wr{position:absolute;top:0;height:32px;width:70px;display:flex;align-items:center;opacity:0}
.wl{left:0;padding-left:14px}
.wr{right:0;padding-right:14px;justify-content:flex-end}
.wl img{display:block;width:20px;height:20px}
.bars{display:flex;align-items:center;gap:2px;height:16px}
.bars i{display:block;width:2px;height:3px;border-radius:1px;background:var(--t1)}

/* le ruban : une ligne, détaché de l'encoche */
.rib{position:absolute;top:36px;left:50%;width:320px;margin-left:-160px;height:28px;z-index:4;background:var(--k0);border-radius:10px;
  transform-origin:50% 0;visibility:hidden;opacity:0}
.tw{position:absolute;left:var(--in,12px);right:var(--in,12px);top:0;bottom:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--f,0px));mask-image:linear-gradient(90deg,transparent 0,#000 var(--f,0px))}
.tx{position:absolute;left:0;top:0;height:28px;line-height:28px;white-space:nowrap;color:var(--t1);will-change:transform}
.tx span{display:inline-block;margin-right:4px;transition:color .2s ease}
.tx span.t{color:var(--t3)}
.tx span.n{animation:wi .16s ease-out}
@keyframes wi{from{opacity:0}to{opacity:1}}
.ib{position:absolute;top:2px;width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--t2);opacity:0;transition:background-color .12s ease,transform .1s ease,color .12s ease}
.ib:hover,.ib.hot{background:var(--k3);color:var(--t1)}
.ib:active,.ib.hot{transform:scale(.94)}
.ib.x{left:2px}.ib.v{right:2px;color:var(--t1)}

/* touche */
.leg{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--t3);font-size:12px;transition:opacity .2s ease}
.kc{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:5px;background:var(--k3);color:var(--t2);
  font:500 12px/1 var(--font);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:transform .08s ease,background-color .08s ease,color .08s ease}
.kc.down{transform:translateY(1px) scale(.95);background:#3a3a3e;color:var(--t1)}

:focus-visible{outline:2px solid var(--t2);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.caret{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="menu"><div><b>Notes</b><span>Fichier</span><span>Édition</span><span>Format</span><span>Présentation</span><span>Fenêtre</span></div><span>lun. 9 nov.&nbsp;&nbsp;18:42</span></div>
  <div class="win"><i></i><i></i><i></i>
    <div class="doc" id="doc"><h3>Rendez-vous client</h3>
      <p>Appel ce matin, elle est intéressée par l’offre complète. Elle veut revoir le prix avant de signer.</p>
      <p id="end"><span class="caret" id="caret"></span></p></div></div>

  <div class="notch" id="notch"><div class="clip" id="clip">
    <div class="wl" id="wl"><img src="notes.png" alt="Notes"></div>
    <div class="wr" id="wr"><div class="bars" id="bars"></div></div>
  </div></div>

  <div class="rib" id="rib">
    <button class="ib x" id="bx" aria-label="Annuler" title="Annuler (Échap)"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    <div class="tw" id="tw"><div class="tx" id="tx"></div></div>
    <button class="ib v" id="bv" aria-label="Valider" title="Valider (↵)"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button>
  </div>

  <div class="leg" id="leg"><span class="kc" id="kc">fn</span><span id="lt"></span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NW=180, OW=320, NBARS=10;
const S1="On se voit mercredi pour parler du devis, je t’envoie le lien juste après.";
const S2="Je te rappelle demain matin pour confirmer l’horaire.";
const SPARE=["Peux-tu m’envoyer la facture avant vendredi.","Ajoute Abidjan à la liste des déplacements du mois."];

/* ressort : part de la valeur affichée, garde la vitesse, toujours interrompable */
class Spring{
  constructor(x,z=1,r=.3){this.x=x;this.v=0;this.t=x;this.z=z;this.r=r}
  to(t,z,r){this.t=t;this.z=z;this.r=r;if(reduce){this.x=t;this.v=0}kick()}
  step(dt){const w=2*Math.PI/this.r;this.v+=(-w*w*(this.x-this.t)-2*this.z*w*this.v)*dt;this.x+=this.v*dt}
  get rest(){return Math.abs(this.x-this.t)<.05&&Math.abs(this.v)<.05}
}
const sw=new Spring(NW), sr=new Spring(0), si=new Spring(12), sx=new Spring(0);
const st={mode:'idle',words:[],amp:0,lv:Array(NBARS).fill(0)};

const el={notch:$('notch'),clip:$('clip'),wl:$('wl'),wr:$('wr'),rib:$('rib'),tw:$('tw'),tx:$('tx'),bx:$('bx'),bv:$('bv'),bars:$('bars')};
el.bars.innerHTML='<i></i>'.repeat(NBARS);
const bar=[...el.bars.children];

/* boucle : rAF, avec un repli minuteur */
let raf=0,tm=0,last=0;
function kick(){if(raf||tm)return;last=performance.now();raf=requestAnimationFrame(tick);tm=setTimeout(()=>tick(performance.now()),34)}
function tick(now){
  cancelAnimationFrame(raf);clearTimeout(tm);raf=tm=0;
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  let busy=false;
  for(const s of [sw,sr,si,sx]){for(let t=0;t<dt;t+=1/240)s.step(1/240);if(s.rest){s.x=s.t;s.v=0}else busy=true}
  apply();
  if(st.mode==='hold'||st.mode==='free'||st.mode==='fin'||st.lv.some(v=>v>.01)){busy=true;level()}
  if(busy)kick();
}
function apply(){
  const w=sw.x,uw=clamp((w-NW)/(OW-NW));
  el.notch.style.width=w+'px';
  el.clip.style.borderRadius=`0 0 ${10+2*uw}px ${10+2*uw}px`;
  el.notch.style.setProperty('--sh',clamp((w-NW)/30));
  const op=clamp((uw-.55)/.35);
  el.wl.style.opacity=el.wr.style.opacity=op;
  el.wl.style.transform=`scale(${.8+.2*op})`;el.wl.style.transformOrigin='24px 50%';
  const p=sr.x;
  el.rib.style.visibility=p>.01?'visible':'hidden';
  el.rib.style.opacity=clamp(p*1.7);
  el.rib.style.transform=`translateY(${(p-1)*28}px) scaleX(${.72+.28*clamp(p)})`;
  el.rib.style.boxShadow=`0 8px 20px -8px rgba(0,0,0,${.6*clamp(p)})`;
  const inset=si.x,bo=clamp((inset-16)/16)*clamp(p*1.7);
  el.rib.style.setProperty('--in',inset+'px');
  el.bx.style.opacity=el.bv.style.opacity=bo;
  el.bx.style.pointerEvents=el.bv.style.pointerEvents=bo>.6?'auto':'none';
  el.tx.style.transform=`translateX(${sx.x}px)`;
  el.rib.style.setProperty('--f',(20*clamp(-sx.x/10))+'px');
}
/* le son : suit la voix, retombe à plat au silence */
function level(){
  const live=st.mode==='hold'||st.mode==='free';
  st.amp*=.94;
  const base=live?.14+.86*st.amp:0;
  bar.forEach((b,i)=>{
    const e=1-Math.abs(i-(NBARS-1)/2)/(NBARS*.75);
    const m=st.lv[i]=st.lv[i]*.55+Math.random()*base*(.45+.55*e)*.45;
    b.style.height=(3+13*clamp(m*1.35))+'px';
  });
}

/* le ruban */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function scrollTo(){
  const win=el.rib.offsetWidth-2*si.t,cw=el.tx.scrollWidth;
  sx.to(Math.min(0,win-cw),1,.28);
}
function addWord(w){
  const prev=el.tx.lastElementChild;if(prev)prev.classList.remove('t');
  const s=document.createElement('span');s.className='t n';s.textContent=w;el.tx.appendChild(s);
  st.words.push(w);st.amp=1;scrollTo();kick();
}
function begin(mode){
  if(st.mode!=='idle')return;
  st.mode=mode;st.words=[];el.tx.innerHTML='';sx.x=sx.t=0;
  si.x=si.t=mode==='free'?36:12;
  sw.to(OW,.9,.34);
  setTimeout(()=>{if(st.mode==='hold'||st.mode==='free')sr.to(1,.9,.4)},reduce?0:130);
}
function toFree(){st.mode='free';si.to(36,1,.3);scrollTo()}
function finalize(){
  if(st.mode!=='hold'&&st.mode!=='free')return false;
  st.mode='fin';[...el.tx.children].forEach(s=>s.classList.remove('t'));kick();return true;
}
function retract(){
  st.mode='closing';
  sr.to(0,1,.24);
  setTimeout(()=>sw.to(NW,1,.26),reduce?0:90);
  setTimeout(()=>{st.mode='idle';leg();kick()},reduce?0:420);
}
function paste(text){
  if(!text)return;
  const end=$('end'),s=document.createElement('span');s.className='new';
  s.textContent=(end.querySelector('.new')?' ':'')+text;end.insertBefore(s,$('caret'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>s.classList.add('old'),60)));
}
function validate(){
  if(!finalize())return;
  const text=st.words.join(' ');
  setTimeout(()=>{retract();setTimeout(()=>{paste(text);idleDone()},reduce?0:200)},reduce?0:400);
}
function cancel(){
  if(st.mode!=='hold'&&st.mode!=='free')return;
  stopSpeech();retract();idleDone();
}

/* parole simulée : un mot après l'autre */
let speech=[];
function speak(text,t0){
  let t=t0;
  text.split(' ').forEach((w,i)=>{
    t+=130+w.length*24+((i*37)%5)*14;
    speech.push(setTimeout(()=>{if(st.mode==='hold'||st.mode==='free')addWord(w)},t));
  });
  return t;
}
function stopSpeech(){speech.forEach(clearTimeout);speech=[]}

/* légende : la touche, là où elle sert */
function leg(txt,down){
  $('lt').textContent=txt===undefined?$('lt').textContent:txt;
  if(down!==undefined)$('kc').classList.toggle('down',down);
}

/* scénario en boucle */
const T=[];const at=(ms,f)=>T.push(setTimeout(f,ms));
function clearT(){T.forEach(clearTimeout);T.length=0}
function loop(first){
  const doc=$('doc'),end=$('end');
  if(!first)doc.classList.add('off');
  at(first?0:reduce?0:300,()=>{end.querySelectorAll('.new').forEach(n=>n.remove());doc.classList.remove('off');leg('maintenir pour dicter',false)});
  /* 1. fn tenue */
  at(1000,()=>leg(undefined,true));
  at(1150,()=>begin('hold'));
  const e1=speak(S1,1700);
  /* 2. relâche, finalisation, texte dans Notes */
  at(e1+600,()=>{leg(undefined,false);finalize();validateAfter()});
  const validateAfter=()=>{const text=st.words.join(' ');setTimeout(()=>{retract();setTimeout(()=>paste(text),reduce?0:200)},reduce?0:400)};
  /* 3. mains libres : deux appuis */
  const m=e1+3300;
  at(m,()=>{leg('deux appuis pour les mains libres',false)});
  at(m+500,()=>leg(undefined,true));at(m+640,()=>leg(undefined,false));
  at(m+780,()=>{leg(undefined,true);begin('free')});at(m+920,()=>leg(undefined,false));
  const e2=speak(S2,m+1500);
  at(e2+700,()=>{$('bv').classList.add('hot')});
  at(e2+900,()=>{$('bv').classList.remove('hot');validate()});
  at(e2+4600,()=>{loop()});
}
let resume=0;
function idleDone(){clearTimeout(resume);if(manual)resume=setTimeout(()=>{manual=false;loop()},6000)}

/* jeu au clavier et à la souris */
let manual=false,downAt=0,upAt=0,tapPending=false,fDown=false;
function takeover(){if(!manual){manual=true;clearT();stopSpeech();clearTimeout(resume)}}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='f'&&!e.repeat&&!e.metaKey&&!e.ctrlKey){
    takeover();fDown=true;leg(undefined,true);
    if(st.mode==='idle'){
      if(tapPending&&performance.now()-upAt<380){tapPending=false;begin('free');speak(SPARE[0],200)}
      else{downAt=performance.now();begin('hold');speak(S1,500)}
    }else if(tapPending&&st.mode==='hold'){tapPending=false;toFree()}
  }else if(k==='escape'&&(st.mode==='hold'||st.mode==='free')){takeover();cancel()}
  else if(k==='enter'&&st.mode==='free'){e.preventDefault();takeover();validate()}
});
addEventListener('keyup',e=>{
  if(e.key.toLowerCase()!=='f'||!manual||!fDown)return;
  fDown=false;leg(undefined,false);upAt=performance.now();
  if(st.mode==='hold'){
    if(upAt-downAt<250){tapPending=true;setTimeout(()=>{if(tapPending){tapPending=false;if(st.mode==='hold')cancel()}},380)}
    else{stopSpeech();validate()}
  }
});
$('bx').addEventListener('click',()=>{takeover();cancel()});
$('bv').addEventListener('click',()=>{takeover();validate()});

apply();kick();loop(true);
</script>
</body>
</html>
