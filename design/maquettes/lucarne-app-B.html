<!doctype html>
<!--
Lucarne — direction B « App Apple vitrine ».
L'app de bureau Lucarne pensée comme les apps grand public récentes d'Apple : grands titres, beaucoup d'air,
une barre d'onglets en verre qui flotte en haut au milieu (pas de barre latérale), des tuiles de tailles différentes,
un thème clair et chaud, et un bouton lune pour le sombre.
12 étapes :
  1      ouverture : l'encoche s'ouvre, l'icône en tombe, la fenêtre se forme autour d'elle ;
  2-6    cinq cartes qui glissent, chacune avec une grande image animée qui montre le geste
         (micro, écrire dans tes apps, touche fn, clé Groq, essai : fn + parler → le texte s'écrit) ;
  7      « Aujourd'hui » : anneau des mots dictés, temps gagné, prochaine réunion, dernière note, étagère ;
  8-10   « Découvrir » : sept fonctions de l'îlot en petites scènes, et « Essayer » en vrai (le Centre, puis Lucarne déplacée
         par appui long et glisser, en verre hors de l'encoche) ;
  11     Réunions : la liste et la note ;
  12     Réglages en cinq groupes, puis le bouton lune : toute la fenêtre passe en sombre.
Aucun raccourci clavier : seule la touche fn (tenir pour dicter). Personnes, fichiers et échanges inventés.
Moteur de l'îlot (forme `chemin`/`cote`, ressorts) repris de ilot-centre.html et lucarne-app.html.
Fichier autonome : aucune ressource externe, polices système, icône Lucarne intégrée. 1 px CSS = 1 pt.
Paramètres d'URL : ?etape=N&fige=1 (pose la fin de l'étape N, tout figé ; 0 = avant la première)
                   ?etape=N&joue=1 (pose l'étape N-1 puis joue l'étape N)   ·   ?lent=1 (ralenti ×4)
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucarne · B · App vitrine</title>
<style>
:root{
  --k:1;
  --ressort:cubic-bezier(.2,.9,.25,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:ui-serif,"New York",Charter,Georgia,serif;
  --regie:#0f0f11; --clair:#f5f5f7;
  --orange:#f2841c; --vert:#2fb457; --bleu:#0a7aff; --jaune:#d99a06; --sarcelle:#1f9fb5; --corail:#e8835c; --rouge:#ff453a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--regie)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--clair);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:default;text-align:inherit}
svg{display:block;overflow:visible}
img{display:block}
html.fige *,html.fige *::before,html.fige *::after{animation-play-state:paused!important}
html.snap *,html.snap *::before,html.snap *::after{transition:none!important}

/* ===================== le faux écran (macOS 26, clair) ===================== */
#ecran{position:relative;height:clamp(470px,calc(100vh - 160px),780px);overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;
  background:#e6e9ee;transition:opacity calc(.26s*var(--k)) ease}
.papier{position:absolute;inset:0;background:
  radial-gradient(70% 80% at 88% 0%,rgba(255,255,255,.8) 0,rgba(255,255,255,0) 60%),
  radial-gradient(65% 85% at 2% 100%,rgba(250,212,176,.95) 0,rgba(250,212,176,0) 62%),
  linear-gradient(166deg,#cdd9e8 0%,#e1e6ec 36%,#efe7de 68%,#f4dcc7 100%)}
.papier svg{position:absolute;inset:0;width:100%;height:100%}
.mb{position:absolute;left:0;right:0;top:0;height:33px;display:flex;justify-content:space-between;z-index:4;font-size:13.5px;color:#1d1d1f;white-space:nowrap;pointer-events:none}
.menus,.etats{display:flex;flex-wrap:wrap;align-content:flex-start;height:33px;overflow:hidden;max-width:calc(50% - 150px)}
.menus{column-gap:19px;padding-left:18px}
.menus>*{height:33px;line-height:33px;font-weight:500}
.menus>svg{height:17px;margin-top:7px;flex:none}
.menus>b{font-weight:700}
.etats{flex-direction:row-reverse;column-gap:15px;padding-right:15px}
.etats>*{height:33px;display:flex;align-items:center;flex:none}
.etats svg{width:17px;height:17px;color:#1d1d1f}
.etats .heure{font-weight:500;font-variant-numeric:tabular-nums}

/* ===================== la fenêtre Lucarne ===================== */
#fen{
  --win:#f8f5f0; --card:#fff; --ink:#1d1d1f; --ink2:#6c6c71; --ink3:#9d9da3; --hair:rgba(0,0,0,.075); --fill:rgba(0,0,0,.05);
  --glass:rgba(255,255,255,.66); --sel:rgba(0,0,0,.075); --ombreC:0 1px 2px rgba(70,45,20,.05),0 6px 18px -8px rgba(70,45,20,.12);
  --bordC:0 0 0 .5px rgba(0,0,0,.06); --bouton:#1d1d1f; --boutonT:#fff; --scene:linear-gradient(170deg,#d7e2ef 0%,#e9e9ea 55%,#f3e2d2 100%);
  position:absolute;left:calc(50% - min(450px,50% - 145px));width:min(900px,calc(100% - 290px));top:44px;height:min(540px,calc(100% - 56px));
  border-radius:24px;overflow:hidden;z-index:2;background:var(--win);color:var(--ink);
  box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 30px 70px -22px rgba(40,30,20,.42),0 10px 24px -12px rgba(40,30,20,.22);
  transition:opacity calc(.35s*var(--k)) ease,background-color .5s ease,color .5s ease,box-shadow .5s ease}
#fen.cache{opacity:0;pointer-events:none}
#fen.forme{box-shadow:none}
#fen.nuit{
  --win:#1c1c1e; --card:#2a2a2d; --ink:#f5f5f7; --ink2:#aeaeb3; --ink3:#7d7d83; --hair:rgba(255,255,255,.08); --fill:rgba(255,255,255,.07);
  --glass:rgba(52,52,56,.66); --sel:rgba(255,255,255,.15); --ombreC:none; --bordC:inset 0 0 0 .5px rgba(255,255,255,.08); --bouton:#f5f5f7; --boutonT:#1c1c1e;
  --scene:linear-gradient(170deg,#2c3440 0%,#30302f 55%,#3b3129 100%);
  box-shadow:0 0 0 .5px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(255,255,255,.1),0 30px 70px -22px rgba(20,20,30,.6),0 10px 24px -12px rgba(20,20,30,.35)}
.feux{position:absolute;left:18px;top:18px;display:flex;gap:8px;z-index:6}
.feux i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.feux i:nth-child(1){background:#ff5f57}.feux i:nth-child(2){background:#febc2e}.feux i:nth-child(3){background:#28c840}
.carte-b,.tu,.de,.grp,.reu-note,.reu-r,.onglets,.theme,.champ-cle,.es-champ{transition:background-color .5s ease,color .5s ease,box-shadow .5s ease}

/* ----- les deux grandes vues ----- */
.vue{position:absolute;inset:0;transition:opacity calc(.45s*var(--k)) ease,transform calc(.6s*var(--k)) var(--ressort),filter calc(.45s*var(--k)) ease}
.vue.cache{opacity:0;pointer-events:none}
#vOnb.cache{transform:scale(.97);filter:blur(6px)}
#vApp.cache{transform:scale(1.02)}

/* ===================== premier lancement ===================== */
#obPiste{position:absolute;inset:0;width:600%;display:flex;transition:transform calc(.8s*var(--k)) var(--ressort)}
.ob{width:calc(100% / 6);height:100%;position:relative;flex:none}
/* bienvenue */
.bien{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px 18px}
#accIc{width:104px;height:104px;filter:drop-shadow(0 10px 18px rgba(60,40,20,.18))}
#accIc.attend{opacity:0}
.bien h1{font-size:42px;line-height:48px;font-weight:700;letter-spacing:-1.1px;margin-top:18px}
.bien p{font-size:16px;line-height:24px;color:var(--ink2);margin-top:10px;max-width:470px}
.bien .gros{margin-top:26px}
.bien .sous{font-size:12.5px;color:var(--ink3);margin-top:12px}
.ap{opacity:0;transform:translateY(12px);transition:opacity calc(.5s*var(--k)) ease calc(var(--i,0)*.08s*var(--k)),transform calc(.7s*var(--k)) var(--ressort) calc(var(--i,0)*.08s*var(--k))}
.bien.on .ap{opacity:1;transform:none}
.gros{height:42px;border-radius:21px;padding:0 30px;background:var(--bouton);color:var(--boutonT);font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
  transition:transform calc(.3s*var(--k)) var(--ressort),background-color .5s,color .5s}
.gros:active,.gros.appui{transform:scale(.95)}
/* une carte */
.carte-o{display:grid;grid-template-columns:47% 1fr;gap:38px;padding:50px 22px 58px}
.il{position:relative;border-radius:22px;overflow:hidden;height:100%}
.ob-d{display:flex;flex-direction:column;justify-content:center;padding-right:34px;min-width:0}
.ob-n{font-size:13px;font-weight:600;color:var(--orange);letter-spacing:.1px}
.ob-d h2{font-size:33px;line-height:38px;font-weight:700;letter-spacing:-.8px;margin-top:6px}
.ob-d p{font-size:15px;line-height:22px;color:var(--ink2);margin-top:10px;max-width:360px}
.ob-act{display:flex;align-items:center;gap:14px;margin-top:24px;height:42px}
.ob-act .gros{height:40px;padding:0 22px;font-size:14px}
.ob-ok{display:none;align-items:center;gap:7px;height:30px;border-radius:15px;padding:0 12px 0 6px;background:rgba(47,180,87,.13);color:#21863f;font-size:13px;font-weight:600}
#fen.nuit .ob-ok{color:#6fdc8e;background:rgba(47,180,87,.2)}
.ob-ok i{width:20px;height:20px;border-radius:50%;background:var(--vert);display:grid;place-items:center}
.ob.fait .ob-ok{display:flex}
.plus-tard{font-size:13.5px;color:var(--ink3);font-weight:500}
.ob.fait .plus-tard{display:none}
.points{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:7px;opacity:0;transition:opacity .4s ease}
.points.vu{opacity:1}
.points i{width:7px;height:7px;border-radius:4px;background:rgba(0,0,0,.16);transition:width calc(.5s*var(--k)) var(--ressort),background-color .3s}
.points i.ici{width:22px;background:var(--ink)}
.points i.fait{background:var(--vert)}
/* clé Groq */
.champ-cle{margin-top:16px;height:40px;width:330px;max-width:100%;border-radius:12px;background:var(--card);box-shadow:var(--bordC),0 1px 2px rgba(0,0,0,.05);display:flex;align-items:center;gap:6px;padding:0 12px;font:500 13.5px/1 ui-monospace,Menlo,monospace;color:var(--ink3)}
.champ-cle.plein{color:var(--ink)}
.champ-cle .verif{margin-left:auto;width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.15);border-top-color:var(--ink2);animation:tourne .8s linear infinite;display:none}
.champ-cle.verifie .verif{display:block}
.champ-cle .lien{margin-left:auto;font:600 12.5px var(--sans);color:var(--bleu)}
.champ-cle.plein .lien{display:none}
/* l'essai */
.es-champ{margin-top:16px;width:350px;max-width:100%;min-height:74px;border-radius:14px;background:var(--card);box-shadow:var(--bordC),0 1px 2px rgba(0,0,0,.05);padding:13px 15px;font-size:17px;line-height:24px;color:var(--ink);transition:box-shadow .3s}
.es-champ.ecoute{box-shadow:0 0 0 2px rgba(242,132,28,.55),0 6px 18px -8px rgba(242,132,28,.4)}
.es-champ .vide{color:var(--ink3)}
.caret{display:inline-block;width:2px;height:20px;background:var(--orange);vertical-align:-4px;margin-left:1px;animation:clign 1s steps(1) infinite}
@keyframes clign{50%{opacity:0}}
.es-etat{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:500;color:var(--ink3);height:18px}
.es-etat .eq{width:18px}
.es-pret{display:none;align-items:center;gap:12px;margin-top:20px}
.ob.reussi .es-pret{display:flex}
.ob.reussi .ob-act{display:none}
.coche-r{position:relative;width:36px;height:36px;flex:none}
.coche-r svg{position:absolute;inset:0}
.coche-r .c1{stroke-dasharray:107;stroke-dashoffset:107;transition:stroke-dashoffset calc(.55s*var(--k)) ease .1s}
.coche-r .c2{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset calc(.3s*var(--k)) ease .55s}
.ob.reussi .coche-r .c1,.ob.reussi .coche-r .c2{stroke-dashoffset:0}

/* ----- les grandes images animées ----- */
.il-micro{background:radial-gradient(90% 80% at 50% 45%,#fff3e7 0,#fbe3cf 60%,#f7d6bd 100%)}
.il-acces{background:radial-gradient(90% 80% at 50% 40%,#eef5fd 0,#dbe9f8 60%,#cddff3 100%)}
.il-fn{background:radial-gradient(90% 80% at 40% 40%,#faf4ea 0,#f1e6d4 60%,#e9dac3 100%)}
.il-groq{background:radial-gradient(90% 80% at 50% 40%,#effaf3 0,#daf0e2 60%,#c9e7d4 100%)}
.il-essai{background:radial-gradient(90% 80% at 50% 40%,#fdf0ec 0,#f8ddd5 60%,#f2cfc4 100%)}
#fen.nuit .il{filter:brightness(.82) saturate(.9)}
.centre-il{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
/* 1 micro : une voix, des ondes */
.ondes i{position:absolute;left:50%;top:46%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:2px solid rgba(242,132,28,.5);animation:onde 2.7s cubic-bezier(.2,.6,.3,1) infinite}
.ondes i:nth-child(2){animation-delay:-.9s}.ondes i:nth-child(3){animation-delay:-1.8s}
@keyframes onde{0%{transform:scale(.95);opacity:.95}100%{transform:scale(2.5);opacity:0}}
.rond-micro{position:absolute;left:50%;top:46%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 18px 40px -14px rgba(200,100,20,.45),0 0 0 .5px rgba(0,0,0,.05);animation:respire 2.7s ease-in-out infinite}
@keyframes respire{50%{transform:scale(1.04)}}
.il-puce{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);height:30px;border-radius:15px;padding:0 13px;background:rgba(255,255,255,.75);
  box-shadow:0 0 0 .5px rgba(0,0,0,.07);display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:#4a4a4f;white-space:nowrap}
.fnk{display:inline-grid;place-items:center;min-width:22px;height:18px;border-radius:5px;padding:0 5px;background:#fff;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.18);
  font:700 10.5px/1 var(--sans);color:#3a3a3f;vertical-align:1px}
/* 2 écrire : une fenêtre où le texte s'écrit tout seul */
.mfen{position:absolute;left:50%;top:50%;width:300px;margin-left:-150px;margin-top:-92px;border-radius:14px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 24px 44px -18px rgba(30,60,110,.38)}
.mfen-b{height:30px;display:flex;align-items:center;gap:6px;padding:0 11px;border-bottom:1px solid #eef0f3}
.mfen-b i{width:9px;height:9px;border-radius:50%;background:#e2e3e8}
.mfen-b span{margin-left:8px;font-size:11.5px;font-weight:600;color:#8a8b92}
.mfen-l{height:28px;display:flex;align-items:center;gap:6px;padding:0 14px;font-size:12.5px;color:#1d1d1f;border-bottom:1px solid #f1f2f5}
.mfen-l span{color:#9a9ba1}
.mfen-t{padding:12px 14px 16px;font-size:15px;line-height:21px;color:#1d1d1f;white-space:nowrap;height:72px}
.tape{display:inline-block;overflow:hidden;vertical-align:bottom;white-space:nowrap;width:0;animation:tape 5s steps(34) infinite}
@keyframes tape{0%,14%{width:0}54%,92%{width:252px}100%{width:0}}
.mfen-t .caret{height:18px;vertical-align:-3px;background:var(--bleu)}
.mlu{position:absolute;left:50%;top:50%;margin:-142px 0 0 -54px;width:108px;height:30px;border-radius:0 0 15px 15px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  animation:mluVu 5s ease infinite}
@keyframes mluVu{0%,10%{opacity:0;transform:translateY(-6px)}16%,62%{opacity:1;transform:none}70%,100%{opacity:0;transform:translateY(-6px)}}
/* 3 la touche fn : un doigt appuie */
.clav{position:absolute;left:28px;bottom:22px;display:flex;gap:10px;padding:12px;border-radius:20px;background:#d9dbe0;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 .5px rgba(0,0,0,.08)}
.tch{width:88px;height:80px;border-radius:12px;background:linear-gradient(#fdfdfd,#f1f1f3);box-shadow:0 3px 0 #b9bbc2,0 0 0 .5px rgba(0,0,0,.12);position:relative;
  font-size:13px;font-weight:500;color:#55575e;padding:10px 12px;display:flex;align-items:flex-end;justify-content:flex-end}
.tch-fn{flex-direction:column;align-items:flex-start;justify-content:space-between;color:#1d1d1f;font-weight:600;font-size:16px;animation:enfonce 3.2s ease-in-out infinite}
@keyframes enfonce{0%,22%{transform:none;box-shadow:0 3px 0 #b9bbc2,0 0 0 .5px rgba(0,0,0,.12)}30%,70%{transform:translateY(3px);box-shadow:0 0 0 #b9bbc2,0 0 0 2.5px rgba(242,132,28,.85)}78%,100%{transform:none}}
.doigt{position:absolute;left:423px;bottom:-159px;width:64px;height:430px;transform-origin:50% 0;transform:rotate(62deg);animation:doigt 3.2s cubic-bezier(.4,0,.2,1) infinite;filter:drop-shadow(-8px 8px 12px rgba(90,60,30,.24))}
.doigt svg{display:block}
@keyframes doigt{0%,8%{transform:translate(56px,-30px) rotate(62deg);opacity:0}16%{opacity:1}28%,70%{transform:translate(0,0) rotate(62deg);opacity:1}84%,100%{transform:translate(56px,-30px) rotate(62deg);opacity:0}}
.bulle{position:absolute;left:50%;top:26px;transform:translateX(-50%);height:40px;border-radius:20px;padding:0 16px 0 12px;background:#fff;display:flex;align-items:center;gap:8px;
  font-size:13px;color:#55575e;white-space:nowrap;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 10px 24px -12px rgba(80,60,30,.35)}
.bulle b{color:#1d1d1f;font-weight:600}
.bulle .choix{height:24px;border-radius:7px;padding:0 9px;display:flex;align-items:center;background:#eef3ff;color:#0a64d8;font-weight:600}
/* 4 la clé : on colle, c'est vérifié */
.presse{position:absolute;left:50%;top:50%;margin:-96px 0 0 -62px;width:124px;height:34px;border-radius:17px;background:#1d1d1f;color:#fff;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:7px;animation:colle 4.4s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes colle{0%,6%{opacity:0;transform:translateY(-10px)}14%,26%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(46px) scale(.8)}}
.ch-cle{position:absolute;left:50%;top:50%;margin:-26px 0 0 -150px;width:300px;height:52px;border-radius:16px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 16px 34px -16px rgba(20,90,50,.4);
  display:flex;align-items:center;padding:0 16px;font:500 15px/1 ui-monospace,Menlo,monospace;color:#1d1d1f}
.ch-cle .pts{display:inline-block;overflow:hidden;white-space:nowrap;width:0;animation:pts 4.4s steps(14) infinite}
@keyframes pts{0%,32%{width:0}46%,94%{width:150px}100%{width:0}}
.ch-cle .okv{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--vert);display:grid;place-items:center;transform:scale(0);animation:pop 4.4s var(--ressort) infinite}
@keyframes pop{0%,52%{transform:scale(0)}60%,94%{transform:scale(1)}100%{transform:scale(0)}}
.lbl-v{position:absolute;left:50%;top:50%;margin:40px 0 0 0;transform:translateX(-50%);font-size:14px;font-weight:600;color:#21863f;display:flex;align-items:center;gap:6px;opacity:0;animation:lblv 4.4s ease infinite}
@keyframes lblv{0%,56%{opacity:0;transform:translate(-50%,6px)}64%,94%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
/* 5 l'essai : fn tenu, la voix, le texte */
.es-not{position:absolute;left:50%;top:0;width:150px;margin-left:-75px;height:36px;border-radius:0 0 18px 18px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.es-ondes{position:absolute;left:43%;top:29%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;height:70px}
.es-ondes i{width:9px;height:70px;border-radius:5px;background:var(--orange);transform:scaleY(.12);animation:eqG 1.1s ease-in-out infinite}
.es-ondes i:nth-child(2n){animation-duration:.86s;animation-delay:-.3s}.es-ondes i:nth-child(3n){animation-duration:1.3s;animation-delay:-.6s}.es-ondes i:nth-child(5n){animation-delay:-.15s}
@keyframes eqG{0%,100%{transform:scaleY(.14)}25%{transform:scaleY(.8)}50%{transform:scaleY(.38)}75%{transform:scaleY(1)}}
.il-essai .tch-fn{animation:none;transform:translateY(3px);box-shadow:0 0 0 #b9bbc2,0 0 0 2.5px rgba(242,132,28,.85)}
.il-essai .doigt{animation:none}
.il-essai .tenir{position:absolute;right:20px;bottom:20px;font-size:12.5px;font-weight:600;color:#8a4a36}

/* ===================== l'app ===================== */

.theme{position:absolute;right:14px;top:12px;width:38px;height:38px;border-radius:19px;z-index:5;display:grid;place-items:center;cursor:pointer;color:var(--ink);background:var(--glass);
  -webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);
  box-shadow:0 0 0 .5px rgba(0,0,0,.13),inset 0 1px 0 rgba(255,255,255,.7),0 8px 22px -10px rgba(40,30,20,.3);transition:transform calc(.3s*var(--k)) var(--ressort),background-color .5s,color .5s}
.theme.appui{transform:scale(.9)}
.theme svg{transition:transform calc(.6s*var(--k)) var(--ressort),opacity .3s}
.theme .lune{position:absolute;opacity:0;transform:rotate(-60deg) scale(.6)}
#fen.nuit .theme .soleil{opacity:0;transform:rotate(60deg) scale(.6)}

.pg{position:absolute;left:0;right:0;top:0;bottom:0;padding:62px 28px 18px;display:flex;flex-direction:column;opacity:0;pointer-events:none;
  transition:opacity calc(.3s*var(--k)) ease}
.pg.on{opacity:1;pointer-events:auto}
.st{opacity:0;transform:translateY(14px) scale(.985);transition:opacity calc(.45s*var(--k)) ease calc(var(--i,0)*.05s*var(--k)),transform calc(.7s*var(--k)) var(--ressort) calc(var(--i,0)*.05s*var(--k)),background-color .5s,box-shadow .5s,color .5s}

.pg-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex:none;margin-bottom:14px}
.pg-h small{display:block;font-size:13px;line-height:16px;font-weight:600;color:var(--ink3)}
.pg-h h1{font-size:32px;line-height:36px;font-weight:700;letter-spacing:-.9px}

.pret{display:flex;align-items:center;gap:8px;height:30px;border-radius:15px;padding:0 13px;background:var(--fill);font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap}

.fnk2{display:inline-grid;place-items:center;min-width:22px;height:18px;border-radius:5px;padding:0 5px;background:var(--card);box-shadow:inset 0 -1px 0 rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.16);font:700 10.5px/1 var(--sans);color:var(--ink)}

.lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;line-height:16px;white-space:nowrap}

/* Aujourd'hui */

.t-mots{grid-column:1 / 3;grid-row:1 / 3;display:flex;flex-direction:column}
.t-mots .corps{flex:1;display:flex;align-items:center;gap:30px;min-height:0}
.anneau{position:relative;width:min(180px,100%);aspect-ratio:1;flex:none}
.anneau svg{width:100%;height:100%;transform:rotate(-90deg)}

.anneau .arc{transition:stroke-dashoffset calc(1.4s*var(--k)) cubic-bezier(.3,.8,.2,1) .2s}

.t-sous{font-size:12.5px;line-height:16px;color:var(--ink2);margin-top:1px}
.semaine{position:absolute;left:18px;right:18px;bottom:15px;height:26px;display:flex;align-items:flex-end;gap:6px}
.semaine i{flex:1;border-radius:3px;background:rgba(47,180,87,.2);transform-origin:50% 100%;transition:transform calc(.8s*var(--k)) var(--ressort) calc(.3s + var(--j)*.04s)}
.semaine i.auj{background:var(--vert)}
.pg:not(.on) .semaine i{transform:scaleY(.05)}
.rejoindre{position:absolute;right:16px;bottom:15px;height:28px;border-radius:14px;padding:0 13px;background:var(--bleu);color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.t-note .serif{font:400 15.5px/21px var(--serif);color:var(--ink);margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.t-note .meta{position:absolute;left:18px;bottom:15px;font-size:12px;color:var(--ink3)}
.pile{position:relative;height:58px;margin-top:10px}
.pile>*{position:absolute;bottom:0;transition:transform calc(.7s*var(--k)) var(--ressort) .35s}
.pile .p1{left:2px;transform:rotate(-8deg)}
.pile .p2{left:40px;transform:rotate(2deg);z-index:1}
.pile .p3{left:84px;transform:rotate(9deg)}
.pg:not(.on) .pile>*{transform:translateY(20px) rotate(0)}
.t-eta .meta{position:absolute;left:18px;right:18px;bottom:15px;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Découvrir */
.decouvertes{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(134px,170px));align-content:start;gap:12px}

.de-l{display:flex;align-items:center;gap:6px;margin:9px 2px 0 4px}

.de-grand{grid-column:1 / 3;flex-direction:row;gap:16px;padding:10px}
.de-grand .sc{flex:1.25}

/* les petites scènes */
.nt{position:absolute;left:50%;top:0;width:44px;height:11px;transform:translateX(-50%);background:#000;border-radius:0 0 6px 6px;overflow:hidden}
.mtx{position:absolute;font-size:7.5px;font-weight:700;color:#fff;line-height:7px;top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Centre */

.mc-r{display:flex;justify-content:space-between}

/* Étagère */
.k-eta .nt{animation:kEtaN 3.6s var(--ressort) infinite}
@keyframes kEtaN{0%,30%{width:44px;height:11px}40%,62%{width:112px;height:36px;border-radius:0 0 12px 12px}72%,100%{width:72px;height:11px;border-radius:0 0 6px 6px}}

@keyframes kVu3{0%,38%{opacity:0}44%,60%{opacity:1}66%,100%{opacity:0}}
.k-eta .pl{position:absolute;left:7px;top:2px;width:8px;height:6px;border-radius:1.5px;border:1px solid #fff;animation:kVu4 3.6s infinite}

.k-eta .dc{position:absolute;left:50%;top:44%;margin-left:-10px;animation:kDoc 3.6s ease-in-out infinite}
@keyframes kDoc{0%,6%{transform:translate(-30px,10px);opacity:0}12%{opacity:1;transform:translate(-30px,10px)}48%{transform:translate(0,-26px) scale(.8);opacity:1}56%,100%{transform:translate(0,-34px) scale(.3);opacity:0}}
/* Minuteur */
.k-min .nt{animation:kMinN 4s var(--ressort) infinite}

.k-min .caps{position:absolute;left:50%;top:13px;margin-left:-48px;display:flex;gap:4px;animation:kCaps 4s infinite}

.k-min .caps i:nth-child(2){animation:kChoix 4s steps(1) infinite}
@keyframes kChoix{0%,26%{background:rgba(255,255,255,.16);color:#fff}27%,100%{background:#ff9f0a;color:#000}}

.k-min .ail{animation:kAil 4s infinite}

.k-min .rg{position:absolute;left:6px;top:1.5px;width:8px;height:8px}

.k-rap .dit{position:absolute;left:50%;top:22px;transform:translateX(-50%);font:italic 400 10.5px/13px var(--serif);color:var(--ink2);white-space:nowrap;animation:kDit 4.6s infinite}
@keyframes kDit{0%,12%{opacity:0;transform:translate(-50%,4px)}18%,44%{opacity:1;transform:translate(-50%,0)}52%,100%{opacity:0}}
/* Réunions */
.k-reu .nt{width:96px}

/* Claude Code */

.dm-zones{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:420px}

  box-shadow:0 0 0 .5px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.45),inset 0 0 12px rgba(255,255,255,.35),0 10px 26px -8px rgba(20,30,50,.3)}

/* faux pointeur */
.pointeur{position:absolute;left:0;top:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .22s}
.pointeur.vu{opacity:1}

const PORTEE = 1.6, POIGNEE = 0.18;
function cote(g, n, bw){
  const corps = Math.max(0, g.h - B), u = Math.min(corps, 40) / 40, e = 1 - Math.pow(1 - u, 2.5);
  const d = Math.max(0, bw - n) * e, W = n + d, serre = 1 - clamp((n - HC) / 24, 0, 1);
  const rs = g.rs + (4 - g.rs) * serre, rbv = lerp(g.rb + (8 - g.rb) * serre, g.rb, clamp(corps / 12, 0, 1));
  const fe = Math.max(0, Math.min(g.f, d * 0.45, B - rs - 2, corps * 0.6));
  const rte = Math.max(0, Math.min(g.rt, (d - fe) / PORTEE, corps / 3.2));
  const lam = Math.min(1, d / 6), dispo = (1 - lam) * (g.h - rs) + lam * (g.h - B - PORTEE * rte);
  const rbe = Math.max(0, Math.min(rbv, dispo / PORTEE, W / PORTEE));
  return {n, W, d, fe, rte, rbe, rs};
}
function chemin(g){
  const h = g.h, L = cote(g, g.ng, g.bw), D = cote(g, g.nd, g.bd), X = f2, Y = f2;
  const a1 = PORTEE * L.rte, c1 = POIGNEE * a1, a2 = PORTEE * L.rbe, c2 = POIGNEE * a2;
  const b1 = PORTEE * D.rte, d1 = POIGNEE * b1, b2 = PORTEE * D.rbe, d2 = POIGNEE * b2;
  let p = `M${X(-L.n - L.rs)} ${Y(-1)}L${X(-L.n - L.rs)} 0Q${X(-L.n)} 0 ${X(-L.n)} ${Y(L.rs)}`;
  if (L.d > 0.5) p += `L${X(-L.n)} ${Y(B - L.fe)}Q${X(-L.n)} ${B} ${X(-L.n - L.fe)} ${B}L${X(-L.W + a1)} ${B}C${X(-L.W + c1)} ${B} ${X(-L.W)} ${Y(B + c1)} ${X(-L.W)} ${Y(B + a1)}`;
  p += `L${X(-L.W)} ${Y(h - a2)}C${X(-L.W)} ${Y(h - c2)} ${X(-L.W + c2)} ${Y(h)} ${X(-L.W + a2)} ${Y(h)}`;
  p += `L${X(D.W - b2)} ${Y(h)}C${X(D.W - d2)} ${Y(h)} ${X(D.W)} ${Y(h - d2)} ${X(D.W)} ${Y(h - b2)}`;

}

class Ressort{
  constructor(x){ this.x = x; this.v = 0; this.cible = x; this.futur = null; this.attente = 0; this.rep = .45; this.z = .8; }
  viser(c, rep, z, attente){
    if (attente > 0){ this.futur = {c, rep, z}; this.attente = attente; return; }
    this.futur = null; this.attente = 0; this.cible = c; this.rep = rep; this.z = z;
  }
  poser(c){ this.x = c; this.v = 0; this.cible = c; this.futur = null; this.attente = 0; }
  pas(dt){
    if (this.attente > 0){ this.attente -= dt; if (this.attente <= 0 && this.futur){ const f = this.futur; this.futur = null; this.cible = f.c; this.rep = f.rep; this.z = f.z; } }
    const w = 2 * Math.PI / this.rep, a = w * w * (this.cible - this.x) - 2 * this.z * w * this.v;
    this.v += a * dt; this.x += this.v * dt;
  }
  pose(){
    if (this.attente > 0) return false;
    if (Math.abs(this.x - this.cible) < 0.01 && Math.abs(this.v) < 0.05){ this.x = this.cible; this.v = 0; return true; }
    return false;
  }
}
(function(){   // le ressort de macOS, en courbe CSS
  const rep = .42, z = .78, T = .46, N = 36, pts = [];
  let x = 0, v = 0; const w = 2 * Math.PI / rep, k = w * w, c = 2 * z * w, dt = 1 / 600;
  for (let i = 0; i <= N; i++){ pts.push(x); for (let s = 0, n = Math.round((T / N) / dt); s < n; s++){ const a = k * (1 - x) - c * v; v += a * dt; x += v * dt; } }
  pts[pts.length - 1] = 1;
  racine.style.setProperty('--ressort', `linear(${pts.map(p => p.toFixed(4)).join(',')})`);
})();

let jeton = 0, instant = false, enCoursN = 0, cibleN = 0, auto = false;
const minuteries = new Set();
function apres(t, fn){ const id = setTimeout(() => { minuteries.delete(id); fn(); }, t * 1000 * K); minuteries.add(id); return id; }
function annuler(){ minuteries.forEach(clearTimeout); minuteries.clear(); }
function suite(){ const j = jeton; return Promise.resolve().then(() => { if (j !== jeton) throw 'stop'; }); }
function attendre(t){ if (instant) return suite(); const j = jeton; return new Promise((ok, ko) => apres(t, () => (j === jeton ? ok() : ko('stop')))); }
function tween(duree, fn){
  if (instant){ fn(1); return suite(); }
  const j = jeton, t0 = performance.now();
  return new Promise((ok, ko) => { const pas = () => { if (j !== jeton) return ko('stop'); const u = clamp((performance.now() - t0) / (duree * 1000 * K), 0, 1); fn(u); if (u < 1) requestAnimationFrame(pas); else ok(); }; pas(); });
}
const fin = () => instant && enCoursN === cibleN;
const facile = u => 1 - Math.pow(1 - u, 3);
const forme = $('#forme'), ombre = $('#ombre');
const R = {}; CLES.forEach(k => R[k] = new Ressort(REPOS[k]));
const TOUS = CLES.map(k => R[k]);
let cible = {...REPOS}, enCours = false, tPrec = 0;
function ilot(g, o = {}){
  const grand = (g.bw + g.bd) * g.h >= (cible.bw + cible.bd) * cible.h - .5;
  const rep = o.rep ?? (grand ? .46 : .38), z = o.z ?? (grand ? .78 : 1), att = o.attente ?? (grand ? 0 : .06);
  cible = {...g};
  for (const k of CLES){ if (instant) R[k].poser(g[k]); else { const haut = k === 'h' && grand; R[k].viser(g[k], haut ? rep * 1.06 : rep, z, att + (haut ? .02 : 0)); } }
  demarrer();
}
function montre(noms, d = .14){
  const vus = new Set(noms);
  for (const nom in c){ const n = c[nom], on = vus.has(nom); if (on && !n.classList.contains('on')) n.style.setProperty('--d', d + 's'); n.classList.toggle('on', on); }
}
function demarrer(){ if (FIGE || instant){ rendu(); return; } if (!enCours){ enCours = true; tPrec = performance.now(); requestAnimationFrame(boucle); } }
function boucle(){
  const t = performance.now(), dt = clamp((t - tPrec) / 1000, 0, .05) / K; tPrec = t;
  const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
  for (let i = 0; i < n; i++) for (const r of TOUS) r.pas(h);
  let bouge = false; for (const r of TOUS) if (!r.pose()) bouge = true;
  rendu();
  if (bouge) requestAnimationFrame(boucle); else enCours = false;
}
function rendu(){
  const g = {}; for (const k of CLES) g[k] = R[k].x;
  forme.setAttribute('d', chemin(g));
  const a = clamp((g.h - B - 6) / 40, 0, 1);
  ombre.style.filter = a > .01 ? `drop-shadow(0 ${(9 * a).toFixed(1)}px ${(18 * a).toFixed(1)}px rgba(10,20,40,${(.32 * a).toFixed(3)}))` : 'none';
}

const N = ETAPES.length;
const PAUSES = [1.6, 1.6, 1.6, 1.6, 1.6, 2, 2.6, 2.6, 2.2, 2.2, 2.4, 3.4];

/* ===================== régie ===================== */
let etape = 0;
const fr = t => t.replace(/ ([:»?!;])/g, ' $1').replace(/« /g, '« ');
$('#pas').innerHTML = ETAPES.map((e, i) => `<li><button data-e="${i + 1}"><span>${i + 1}</span>${fr(e.c)}</button></li>`).join('');
function nbsp(racineEl){
  const w = document.createTreeWalker(racineEl, NodeFilter.SHOW_TEXT);
  for (let n; (n = w.nextNode());) if (/ [:»?!;]|« /.test(n.nodeValue)) n.nodeValue = fr(n.nodeValue);
}
function majRegie(n){
  etape = n;
  const m = Math.max(1, n), e = ETAPES[m - 1];
  $('#num').textContent = `Lucarne · B, l’app vitrine · étape ${m} sur ${N} · ${e.g}`;
  $('#titre').textContent = fr(e.t); $('#phrase').textContent = fr(e.p);
  $$('#pas button').forEach(b => b.classList.toggle('ici', +b.dataset.e === m));
}
async function poser(n){
  annuler();
  instant = true; racine.classList.add('snap');
  try { cibleN = n; enCoursN = 0; init(); for (let i = 1; i <= n; i++){ enCoursN = i; await ETAPES[i - 1].jeu(); } }
  finally { instant = false; }
  majRegie(n); rendu(); placerSel();
  void ecran.offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => racine.classList.remove('snap')));
}
async function jouer(n){
  majRegie(n);
  if (REDUIT) return poser(n);
  racine.classList.remove('snap'); void ecran.offsetWidth;
  cibleN = 0; enCoursN = n;
  await ETAPES[n - 1].jeu();
}
function arreter(){ jeton++; auto = false; annuler(); geste(''); }
const autoCase = $('#autoCase');
async function tourner(){
  arreter(); const j = jeton; auto = true;
  try {
    await poser(0); await attendre(.9);
    for (;;){
      for (let n = 1; n <= N; n++){ await jouer(n); await attendre(PAUSES[n - 1]); }
      if (!autoCase.checked) break;
      ecran.style.opacity = 0; await attendre(.3);
      await poser(0); ecran.style.opacity = 1; await attendre(1.0);
    }
  } catch (e){ if (e !== 'stop') console.error(e); }
  ecran.style.opacity = 1;
  if (j === jeton) auto = false;
}
function lance(n){ arreter(); ecran.style.opacity = 1; poser(n - 1).then(() => jouer(n)).catch(e => { if (e !== 'stop') console.error(e); }); }
$('#rejouer').addEventListener('click', () => { if (autoCase.checked) tourner(); else lance(Math.max(1, etape)); });
$('#suivant').addEventListener('click', () => { autoCase.checked = false; lance(etape >= N ? 1 : etape + 1); });
$('#pas').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; autoCase.checked = false; lance(+b.dataset.e); });
autoCase.addEventListener('change', () => { if (autoCase.checked) tourner(); else arreter(); });
function ralenti(oui){ K = oui ? 4 : 1; racine.style.setProperty('--k', K); $('#lentCase').checked = oui; }
$('#lentCase').addEventListener('change', e => ralenti(e.target.checked));

/* ===================== à la main : la vraie souris ===================== */
function aLaMain(){ if (auto || autoCase.checked){ autoCase.checked = false; arreter(); } pointeur.classList.remove('vu'); }
ecran.addEventListener('click', e => {
  if (FIGE) return;
  const et = e.target.closest('[data-etape]');
  if (et){ autoCase.checked = false; lance(+et.dataset.etape); return; }
  const pg = e.target.closest('#onglets [data-page]'), th = e.target.closest('#theme'), ap = e.target.closest('#appCh [data-th]'), es = e.target.closest('[data-essai]'), s = e.target.closest('.pg .sw');
  if (!pg && !th && !ap && !es && !s) return;
  aLaMain();
  if (pg) page(pg.dataset.page);
  else if (th){ st.nuit = !st.nuit; st.theme = st.nuit ? 'sombre' : 'clair'; majApp(); }
  else if (ap){ st.theme = ap.dataset.th; st.nuit = st.theme === 'sombre'; majApp(); }
  else if (s) s.classList.toggle('on');
  else if (es){ capsule.className = ''; montre([], 0); ilot(REPOS); demo(es.dataset.essai).catch(() => {}); }
});
window.addEventListener('resize', () => { placerSel(); });

/* ===================== démarrage ===================== */
nbsp(ecran);
geste('');
if (Q.has('lent')) ralenti(true);
const e0 = clamp(+(Q.get('etape') || 0), 0, N);
if (FIGE){ autoCase.checked = false; poser(e0).catch(() => {}); }
else if (Q.has('joue') && e0 >= 1){ autoCase.checked = false; poser(e0 - 1).then(() => setTimeout(() => jouer(e0).catch(() => {}), 400)); }
else setTimeout(() => tourner(), 300);
window.lucarne = {poser, jouer, st:() => st};
