<!doctype html>
<!--
DIRECTION (v4, lettre B, « la goutte »)
Produit : l'encoche d'une app de dictée Mac, pendant que Hugues tient fn et parle.
Forme : l'encoche noire s'allonge vers le bas en une seule languette (200 px, à peine plus large que l'encoche), comme si le noir coulait ; un seul bloc noir, aucun cadre, aucun fond de plus.
Contenu : en haut l'icône de l'app (Notes) et la trace de voix qui défile ; dessous, deux lignes de texte en direct, les derniers mots plus discrets tant qu'ils ne sont pas fixés, les plus anciens qui montent et s'effacent.
Mouvement : trois ressorts (largeur, hauteur, défilement) qui partent de la valeur affichée, donc interruptibles ; la languette grandit avec le texte, puis remonte dans l'encoche. Réduire les animations : plus de ressort, la languette apparaît et disparaît en fondu.
Mains libres : ✕ et ✓ sortent à droite de la même ligne que l'icône. Jouable : maintenir la touche fn en bas (ou la touche D), deux appuis rapides = mains libres, Entrée valide, Échap annule.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dictée, encoche v4 B</title>
<style>
:root{
  --wall:#1b1c1e; --win:#262628;
  --k0:#000; --k2:#1b1b1d; --k3:#2a2a2d;
  --line:rgba(237,237,237,.08);
  --t1:#ededed; --t2:#a1a1a6; --t3:#85858b;
  --acc:#e4572e;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--wall);color:var(--t1);font:13px/16px var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;min-width:1190px;min-height:650px}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
::selection{background:rgba(237,237,237,.22)}
.stage{position:fixed;inset:0;overflow:hidden}

/* barre des menus */
.mb{position:absolute;inset:0 0 auto 0;height:32px;display:flex;align-items:center;gap:20px;padding:0 16px;color:var(--t2)}
.mb b{font-weight:600;color:var(--t1)}
.mb .r{margin-left:auto;font-variant-numeric:tabular-nums}

/* fenêtre Notes */
.win{position:absolute;left:50%;margin-left:-360px;width:720px;top:64px;bottom:72px;background:var(--win);border-radius:10px;overflow:hidden}
.win i{position:absolute;top:12px;width:10px;height:10px;border-radius:50%;background:#3d3d40}
.win i:nth-child(1){left:12px}.win i:nth-child(2){left:28px}.win i:nth-child(3){left:44px}
.doc{position:absolute;left:40px;right:40px;top:112px;color:var(--t2);font-size:15px;line-height:24px}
.doc h3{font-size:22px;line-height:30px;font-weight:600;color:var(--t1);margin-bottom:12px}
.doc p+p{margin-top:12px}
.doc .new{background:rgba(228,87,46,.2);border-radius:3px;transition:background-color 1.6s ease}
.doc .new.old{background:transparent}
.caret{display:inline-block;width:1.5px;height:18px;background:var(--t1);vertical-align:-4px;margin-left:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* l'encoche et sa languette : un seul bloc noir */
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;width:180px;height:32px}
.notch::before,.notch::after{content:"";position:absolute;top:0;width:8px;height:8px;opacity:var(--sh,0)}
.notch::before{left:-8px;background:radial-gradient(circle at 0 100%,transparent 7.5px,#000 8px)}
.notch::after{right:-8px;background:radial-gradient(circle at 100% 100%,transparent 7.5px,#000 8px)}
.clip{position:absolute;inset:0;background:var(--k0);overflow:hidden;border-radius:0 0 10px 10px}
.in{position:absolute;top:32px;left:50%;width:176px;margin-left:-88px;opacity:0}

.hd{height:24px;display:flex;align-items:center;gap:8px}
.ic{width:16px;height:16px;border-radius:4px;flex:none;display:block}
.mt{flex:1;min-width:0;height:16px;display:flex;align-items:center;justify-content:flex-end;gap:2px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.mt i{display:block;flex:none;width:2px;height:2px;border-radius:1px;background:var(--t1)}
.mt.fin i{background:var(--t3)}
.acts{display:flex;gap:4px;width:0;opacity:0;overflow:hidden;flex:none;transition:width .24s cubic-bezier(.22,1,.36,1),opacity .14s ease}
.free .acts{width:52px;opacity:1}
.ib{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:6px;color:var(--t2);transition:background-color .12s ease,transform .1s ease,color .12s ease}
.ib:hover,.ib.down{background:var(--k3);color:var(--t1)}
.ib:active,.ib.down{transform:scale(.94)}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.vp{margin-top:4px;height:32px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 var(--f,0px));mask-image:linear-gradient(180deg,transparent 0,#000 var(--f,0px))}
.tx{font-size:13px;line-height:16px;color:var(--t3)}
.tx span{transition:color .25s ease}
.tx span.f{color:var(--t1)}

/* touche fn jouable */
.cap{position:absolute;left:0;right:0;bottom:20px;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--t3);font-size:12px}
.kc{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 6px;border-radius:5px;background:var(--k3);color:var(--t2);
  font:500 12px/1 var(--font);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:transform .08s ease,background-color .08s ease,color .08s ease;touch-action:none;user-select:none;-webkit-user-select:none}
.kc.down{transform:translateY(1px) scale(.95);background:#3a3a3e;color:var(--t1)}

:focus-visible{outline:2px solid var(--t2);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.in{transition:opacity .15s ease!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="mb"><b>Notes</b><span>Fichier</span><span>Édition</span><span>Présentation</span><span>Fenêtre</span><span class="r">14:41</span></div>
  <div class="win"><i></i><i></i><i></i>
    <div class="doc"><h3>Rendez-vous client</h3>
      <p>Appel ce matin, elle est intéressée par l'offre complète. Elle veut revoir le prix avant de signer.</p>
      <p class="end"><span class="caret"></span></p></div></div>
  <div class="notch" id="notch"><div class="clip" id="clip"><div class="in" id="inn">
    <div class="hd"><img class="ic" src="notes.png" alt="Notes" width="16" height="16"><div class="mt" id="mt"></div>
      <div class="acts"><button class="ib" data-a="x" aria-label="Annuler"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button><button class="ib" data-a="ok" aria-label="Valider"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></button></div></div>
    <div class="vp" id="vp"><div class="tx" id="tx"></div></div>
  </div></div></div>
  <div class="cap"><span class="kc" id="fn" tabindex="0" role="button" aria-label="Touche fn">fn</span><span>maintenir pour dicter, deux appuis pour les mains libres</span></div>
</div>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NW=180, NH=32, OW=200, HD=64;           // encoche, largeur ouverte, hauteur languette sans texte
const SENT=["On se voit mercredi pour parler du devis, je t'envoie le lien juste après.",
 "Je te rappelle demain matin pour confirmer l'horaire.",
 "Peux-tu m'envoyer la facture de Sillonia avant vendredi."];
const $=id=>document.getElementById(id);
const notch=$('notch'),clip=$('clip'),inn=$('inn'),mt=$('mt'),tx=$('tx'),vp=$('vp'),fn=$('fn'),doc=document.querySelector('.end');

/* ressort : part de la valeur affichée, garde la vitesse, interruptible */
class Spring{
  constructor(x){this.x=x;this.v=0;this.t=x;this.z=1;this.r=.3}
  to(t,z,r){this.t=t;this.z=z;this.r=r;if(reduce){this.x=t;this.v=0}}
  step(dt){const w=2*Math.PI/this.r;this.v+=(-w*w*(this.x-this.t)-2*this.z*w*this.v)*dt;this.x+=this.v*dt}
  get rest(){return Math.abs(this.x-this.t)<.05&&Math.abs(this.v)<.05}
}
const sw=new Spring(NW), sh=new Spring(NH), sy=new Spring(0);
function apply(){
  const w=sw.x,h=sh.x,uh=clamp((h-NH)/32);
  clip.style.borderRadius=`0 0 ${10+8*uh}px ${10+8*uh}px`;
  clip.style.boxShadow=`0 ${14*uh}px ${24*uh}px -8px rgba(0,0,0,${.55*uh})`;
  notch.style.width=w+'px';notch.style.height=h+'px';
  notch.style.setProperty('--sh',clamp((w-NW)/8));
  const op=clamp((h-40)/24);
  inn.style.opacity=op;
  if(reduce){inn.style.transform='none';inn.style.filter='none'}
  else{inn.style.transform=op<1?`translateY(${(op-1)*8}px)`:'none';inn.style.filter=op<1?`blur(${(1-op)*4}px)`:'none'}
  tx.style.transform=`translateY(${sy.x}px)`;
  vp.style.setProperty('--f',clamp(-sy.x,0,16)*.9+'px');
}

/* trace de voix : historique qui défile, nourri par les mots dits */
const NB=30, hist=new Array(NB).fill(0), bars=[];
for(let i=0;i<NB;i++){const b=document.createElement('i');mt.appendChild(b);bars.push(b)}
let lvl=0, speakUntil=0, lastMeter=0;
function meter(now){
  if(now-lastMeter<48)return;lastMeter=now;
  const target=st==='hold'||st==='free'?(now<speakUntil?.3+.7*Math.pow(Math.random(),.8):.04):0;
  lvl=lvl*.45+target*.55;hist.shift();hist.push(lvl);
  for(let i=0;i<NB;i++)bars[i].style.height=(2+13*hist[i])+'px';
}
let last=0;
function tick(){
  const now=Date.now(),dt=last?Math.min(.05,(now-last)/1000):1/120;last=now;
  const n=Math.max(1,Math.round(dt*240));
  for(let k=0;k<n;k++){sw.step(1/240);sh.step(1/240);sy.step(1/240)}
  for(const s of [sw,sh,sy])if(s.rest){s.x=s.t;s.v=0}
  apply();meter(now);
}
setInterval(tick,8);

/* deux réserves de minuteurs : le jeu automatique et le coeur (mots, finalisation) */
const A=[], C=[];
const later=(pool,fn,ms)=>{const id=setTimeout(fn,ms);pool.push(id);return id};
const clearPool=p=>{p.forEach(clearTimeout);p.length=0};

/* états : rest, hold, free, final */
let st='rest', words=[], shown=0, sent=0, holdT=0, pend=0, userMode=false, idleT=0;
function setH(){
  const L=Math.round(tx.offsetHeight/16);
  if(!shown){sh.to(HD,.8,.4);sy.to(0,1,.25);return}
  sh.to(70+16*Math.min(L,2),.82,.42);
  sy.to(-16*Math.max(0,L-2),1,.24);
}
function say(){
  if(shown>=words.length||(st!=='hold'&&st!=='free'))return;
  const w=words[shown++],s=document.createElement('span');
  s.textContent=w;if(shown>1)tx.appendChild(document.createTextNode(' '));tx.appendChild(s);
  const sp=tx.querySelectorAll('span');if(sp.length>2)sp[sp.length-3].classList.add('f');
  speakUntil=Date.now()+110+w.length*24;
  setH();
  later(C,say,130+w.length*26);
}
function clearText(){tx.innerHTML='';shown=0;words=[];sy.x=sy.t=0;sy.v=0}
function begin(){
  clearPool(C);clearText();st='hold';words=SENT[sent++%SENT.length].split(' ');
  mt.classList.remove('fin');
  sw.to(OW,.9,.34);sh.to(HD,.8,.4);
  later(C,say,reduce?0:420);
}
function paste(text){
  const s=document.createElement('span');s.className='new';s.textContent=(doc.parentNode.querySelector('.new')?' ':'')+text;
  doc.insertBefore(s,doc.querySelector('.caret'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>s.classList.add('old'),60)));
}
function closeTongue(){sw.to(NW,1,.26);sh.to(NH,1,.28);sy.to(0,1,.25)}
function toRest(){
  st='rest';clearText();notch.classList.remove('free');
  if(userMode){clearTimeout(idleT);idleT=setTimeout(()=>{userMode=false;auto()},7000)}
}
function finish(commit){
  if(st!=='hold'&&st!=='free')return;
  clearPool(C);st='final';mt.classList.add('fin');notch.classList.remove('free');
  const n=shown, text=words.slice(0,n).join(' ');
  tx.querySelectorAll('span').forEach(s=>s.classList.add('f'));
  if(commit&&n){
    later(C,()=>{closeTongue();later(C,()=>paste(text),reduce?0:200);later(C,toRest,700)},reduce?0:400);
  }else{
    closeTongue();later(C,toRest,700);
  }
}
function press(){
  const now=Date.now();
  if(st==='rest'){begin();holdT=now}
  else if(st==='hold'&&pend){clearTimeout(pend);pend=0;st='free';notch.classList.add('free')}
  else if(st==='free'){finish(true)}
}
function release(){
  if(st!=='hold'||pend)return;
  if(Date.now()-holdT<300)pend=setTimeout(()=>{pend=0;finish(true)},420);   // appui bref : on attend un 2e appui
  else finish(true);
}
function act(a){
  const b=document.querySelector(`.ib[data-a="${a}"]`);b.classList.add('down');setTimeout(()=>b.classList.remove('down'),140);
  if(st==='free')finish(a==='ok');
}
function hardReset(){
  clearPool(C);clearTimeout(pend);pend=0;
  if(st!=='rest'){closeTongue();later(C,toRest,700);st='final'}
}

/* jeu automatique : tenue, mains libres validé, mains libres annulé */
const w=ms=>new Promise(r=>later(A,r,ms));
const key=on=>fn.classList.toggle('down',on);
async function tap(){key(true);press();await w(90);key(false);release();await w(130)}
const SCEN=[
  async()=>{await w(1000);key(true);press();await w(4700);key(false);release();await w(3000)},
  async()=>{await w(300);await tap();key(true);press();await w(90);key(false);release();await w(3100);act('ok');await w(2800)},
  async()=>{await w(300);await tap();key(true);press();await w(90);key(false);release();await w(1900);act('x');await w(2200)}
];
let sc=Math.max(0,Math.min(2,(+location.hash.slice(1)||1)-1));sent=sc;
async function auto(){
  for(;;){
    if(sc===0)doc.parentNode.querySelectorAll('.new').forEach(e=>e.remove());
    await SCEN[sc]();sc=(sc+1)%3;
  }
}

/* saisie de Hugues : on prend la main, le jeu reprend après 7 s sans toucher */
function mine(){
  clearPool(A);clearTimeout(idleT);
  if(!userMode&&st!=='rest')hardReset();
  userMode=true;
}
fn.addEventListener('pointerdown',e=>{mine();fn.setPointerCapture(e.pointerId);key(true);press()});
fn.addEventListener('pointerup',()=>{key(false);release()});
fn.addEventListener('pointercancel',()=>{key(false);release()});
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key.toLowerCase()==='d'&&!e.metaKey&&!e.ctrlKey){mine();key(true);press()}
  else if(st==='free'&&e.key==='Enter'){mine();e.preventDefault();act('ok')}
  else if(st==='free'&&e.key==='Escape'){mine();e.preventDefault();act('x')}
});
document.addEventListener('keyup',e=>{if(e.key.toLowerCase()==='d'){key(false);release()}});
document.querySelectorAll('.ib').forEach(b=>b.addEventListener('click',()=>{mine();act(b.dataset.a)}));
addEventListener('blur',()=>{key(false);release()});

apply();auto();
</script>
</body>
</html>
