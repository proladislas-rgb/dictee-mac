<!doctype html>
<!--
Lucarne — direction A, « App système Apple » : on doit croire qu'Apple l'a livrée avec macOS 26.
Structure de Réglages Système : barre latérale en verre flottante (arrondie, détachée du bord), listes groupées
en cartes arrondies, icônes de section dans des carrés de couleur pleine, interrupteurs et menus natifs,
titre intégré à la barre d'outils. Clair par défaut ; « Apparence » dans la régie (ou ?theme=sombre) pour le sombre.
12 étapes :
  1-6   premier lancement façon Assistant de réglages : grand titre, une seule chose par écran, gros bouton bleu
        « Continuer », une coche qui se dessine (micro, écrire dans tes apps, touche fn, clé Groq, essai) ;
  7     Aujourd'hui ; 8-9 Découvrir (« Essayer » le Centre, puis Lucarne déplacée d'un appui long) ;
  10    Réunions ; 11 Réglages en cinq groupes ; 12 le même écran en sombre.
L'icône : ~/Desktop/📁 Projets/Verbe/Verbe-icone/v2/svg/l-lucarne-{light,dark}.svg, en ligne (contour allégé).
L'îlot : forme `chemin`/`cote` et ressorts repris de ilot-centre.html / lucarne-app.html ; verre « Liquide » repris de lucarne-position.html.
Fichier autonome, polices système, 1 px CSS = 1 pt. Personnes et échanges inventés.
Paramètres d'URL : ?etape=N&fige=1 (pose la fin de l'étape N, tout figé ; 0 = avant la première)
                   ?etape=N&joue=1 (pose l'étape N-1 puis joue l'étape N) · ?lent=1 (ralenti ×4) · ?theme=sombre
-->
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucarne · App système</title>
<style>
:root{
  --k:1;
  --ressort:cubic-bezier(.2,.9,.25,1);
  --rebond:cubic-bezier(.3,1.4,.4,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --regie:#0f0f11; --regie-t:#f5f5f7;
  --regieH:150px;
  /* macOS 26, apparence claire */
  --bleu:#007aff; --vert:#34c759; --rouge:#ff3b30; --orange:#ff9500; --jaune:#ffb300; --gris:#8e8e93; --corail:#e8835c; --sarcelle:#30b0c7;
  --t1:#1d1d1f; --t2:#6e6e73; --t3:#8e8e93; --sep:rgba(0,0,0,.085);
  --win:#ffffff; --grp:#f2f2f4; --grp2:#e9e9ec; --btn:rgba(0,0,0,.065); --btn-h:rgba(0,0,0,.1);
  --champ:#ffffff; --champ-b:rgba(0,0,0,.14);
  --side:linear-gradient(180deg,rgba(234,240,248,.92) 0%,rgba(241,238,236,.92) 100%);
  --side-b:rgba(0,0,0,.07); --side-hl:rgba(255,255,255,.95);
  --verre-tb:rgba(255,255,255,.72);
  --win-ombre:0 0 0 .5px rgba(0,0,0,.2),0 30px 70px -16px rgba(30,45,70,.42),0 12px 26px -10px rgba(30,45,70,.22);
  --mb-t:#1d1d1f;
  --sw-off:#e3e3e7;
}
html[data-theme="sombre"]{
  --bleu:#0a84ff; --vert:#30d158; --rouge:#ff453a; --orange:#ff9f0a; --jaune:#ffc20a; --gris:#98989d;
  --t1:#f5f5f7; --t2:#a1a1a6; --t3:#7c7c82; --sep:rgba(255,255,255,.09);
  --win:#1c1c1e; --grp:#2a2a2d; --grp2:#333336; --btn:rgba(255,255,255,.1); --btn-h:rgba(255,255,255,.15);
  --champ:#2a2a2d; --champ-b:rgba(255,255,255,.14);
  --side:linear-gradient(180deg,rgba(44,48,56,.92) 0%,rgba(40,38,40,.92) 100%);
  --side-b:rgba(255,255,255,.08); --side-hl:rgba(255,255,255,.1);
  --verre-tb:rgba(50,50,54,.72);
  --win-ombre:0 0 0 .5px rgba(0,0,0,.8),inset 0 0 0 .5px rgba(255,255,255,.1),0 30px 70px -16px rgba(0,0,0,.65),0 12px 26px -10px rgba(0,0,0,.4);
  --mb-t:#f5f5f7;
  --sw-off:#3a3a3d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--regie)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--t1);overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:default;text-align:inherit}
svg{display:block;overflow:visible}
html.fige *,html.fige *::before,html.fige *::after{animation-play-state:paused!important}
html.snap *,html.snap *::before,html.snap *::after{transition:none!important}
html.fondu #ecran *,html.fondu #ecran{transition:background-color calc(.8s*var(--k)) ease,color calc(.8s*var(--k)) ease,border-color calc(.8s*var(--k)) ease,box-shadow calc(.8s*var(--k)) ease,opacity calc(.8s*var(--k)) ease!important}
html[data-theme="sombre"] .ic-l{display:none}
html:not([data-theme="sombre"]) .ic-d{display:none}

/* ===================== l'écran du Mac ===================== */
#ecran{position:relative;height:max(470px,calc(100vh - var(--regieH)));overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;background:#dfe7f0;color:var(--t1);transition:opacity calc(.26s*var(--k)) ease}
.papier{position:absolute;inset:0;transition:opacity calc(.8s*var(--k)) ease}
.papier svg{position:absolute;inset:0;width:100%;height:100%}
.papier.clair{background:
  radial-gradient(60% 80% at 88% 8%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 60%),
  radial-gradient(55% 75% at 6% 100%,rgba(250,226,206,.95) 0,rgba(250,226,206,0) 62%),
  linear-gradient(165deg,#c4d5ea 0%,#d8e4f1 38%,#ebe9e7 72%,#f2e3d6 100%)}
.papier.sombre{opacity:0;background:
  radial-gradient(60% 80% at 85% 0%,rgba(70,98,140,.55) 0,rgba(70,98,140,0) 60%),
  radial-gradient(55% 75% at 8% 100%,rgba(122,84,62,.5) 0,rgba(122,84,62,0) 62%),
  linear-gradient(165deg,#1b2638 0%,#18202d 45%,#221f22 100%)}
html[data-theme="sombre"] .papier.sombre{opacity:1}
.mb{position:absolute;left:0;right:0;top:0;height:33px;display:flex;justify-content:space-between;z-index:20;font-size:13.5px;color:var(--mb-t);white-space:nowrap;pointer-events:none}
.menus,.etats{display:flex;flex-wrap:wrap;align-content:flex-start;height:33px;overflow:hidden;max-width:calc(50% - 110px)}
.menus{column-gap:19px;padding-left:18px}
.menus>*{height:33px;line-height:33px;font-weight:500}
.menus>svg{height:17px;margin-top:7px;flex:none}
.menus>b{font-weight:700}
.etats{flex-direction:row-reverse;column-gap:15px;padding-right:15px}
.etats>*{height:33px;display:flex;align-items:center;flex:none}
.etats svg{width:17px;height:17px}
.etats .heure{font-weight:500;font-variant-numeric:tabular-nums}

/* ===================== fenêtres ===================== */
.fen{position:absolute;border-radius:20px;overflow:hidden;background:var(--win);box-shadow:var(--win-ombre);
  transition:opacity calc(.22s*var(--k)) ease,transform calc(.55s*var(--k)) var(--ressort),filter calc(.3s*var(--k)) ease}
.fen.cache{opacity:0;transform:scale(.93);pointer-events:none}
.fen.arriere{filter:saturate(.92)}
.feux{position:absolute;left:16px;top:16px;display:flex;gap:8px;z-index:5}
.feux i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.feux i:nth-child(1){background:#ff5f57}.feux i:nth-child(2){background:#febc2e}.feux i:nth-child(3){background:#28c840}
.fen.arriere .feux i{background:#cfcfd3}
html[data-theme="sombre"] .fen.arriere .feux i{background:#48484c}

/* carrés de couleur (icônes de section, façon Réglages) */
.sq{--c:var(--bleu);width:20px;height:20px;border-radius:5.5px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff) 0%,var(--c) 100%);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.45),0 0 0 .5px rgba(0,0,0,.08)}
.sq.g{width:30px;height:30px;border-radius:8px}
.sq.xg{width:62px;height:62px;border-radius:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px -6px color-mix(in srgb,var(--c) 70%,transparent),0 0 0 .5px rgba(0,0,0,.08)}
.sq.noir{background:linear-gradient(180deg,#3a3a3e,#0b0b0c)}

/* boutons, interrupteurs, menus natifs */
.bt{height:24px;border-radius:12px;padding:0 12px;background:var(--btn);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;color:var(--t1);
  transition:background-color .15s,transform calc(.3s*var(--k)) var(--ressort)}
.bt.appuye,.bt:active{transform:scale(.95);background:var(--btn-h)}
.bt.bleu{background:var(--bleu);color:#fff}
.gros{height:32px;border-radius:16px;min-width:116px;padding:0 20px;background:var(--bleu);color:#fff;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,60,140,.25);transition:background-color calc(.3s*var(--k)) ease,color .3s ease,transform calc(.3s*var(--k)) var(--ressort),box-shadow .3s}
.gros.inactif{background:var(--btn);color:var(--t3);box-shadow:none}
.gros.appuye{transform:scale(.95)}
.sw{width:34px;height:20px;border-radius:10px;background:var(--sw-off);position:relative;flex:none;transition:background-color calc(.25s*var(--k)) ease}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.06);transition:transform calc(.38s*var(--k)) var(--ressort),width calc(.2s*var(--k)) ease}
.sw.on{background:var(--bleu)}
.sw.on::after{transform:translateX(14px)}
.pop{height:24px;border-radius:12px;padding:0 6px 0 11px;background:var(--btn);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;color:var(--t1);transition:background-color .2s}
.pop .ch{width:16px;height:16px;border-radius:8px;display:grid;place-items:center;background:var(--bleu);color:#fff}
.pop.vu{background:color-mix(in srgb,var(--bleu) 16%,transparent)}
.champ{height:28px;border-radius:14px;background:var(--btn);display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12.5px;color:var(--t3)}

/* la coche qui se dessine */
.ok{display:none;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--t1);flex:none}
.fait .ok{display:inline-flex}
.fait .act{display:none}
.coche{width:22px;height:22px;flex:none}
.coche circle{fill:var(--vert);transform:scale(0);transform-origin:11px 11px;transition:transform calc(.5s*var(--k)) var(--rebond)}
.coche path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset calc(.32s*var(--k)) ease calc(.22s*var(--k))}
.fait .coche circle,.coche.on circle{transform:scale(1)}
.fait .coche path,.coche.on path{stroke-dashoffset:0}

/* groupes en cartes arrondies */
.grp{background:var(--grp);border-radius:12px}
.rw{position:relative;display:flex;align-items:center;gap:10px;min-height:40px;padding:7px 12px}
.rw+.rw::before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:var(--sep)}
.rw.ic+.rw.ic::before,.rw.ic+.rw::before{left:42px}
.rw .lb{flex:1;min-width:0}
.rw .lb b{display:block;font-size:13px;line-height:17px;font-weight:400;color:var(--t1)}
.rw .lb span{display:block;font-size:11.5px;line-height:15px;color:var(--t2);margin-top:1px}
.gh{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;color:var(--t1);margin:18px 2px 7px}
.gh .lien{margin-left:auto;font-weight:500;font-size:12.5px}
.lien{color:var(--bleu);font-weight:500}

/* ===================== Assistant (premier lancement) ===================== */
.asst{left:calc(50% - 300px);width:600px;top:46px;height:min(452px,calc(100% - 60px));z-index:3}
.ea{position:absolute;left:0;right:0;top:0;bottom:62px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 64px 0;
  opacity:0;transform:translateX(46px);pointer-events:none;
  transition:opacity calc(.28s*var(--k)) ease,transform calc(.6s*var(--k)) var(--ressort)}
.ea.on{opacity:1;transform:none;pointer-events:auto}
.ea.avant{transform:translateX(-46px)}
.ea h2{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.4px;margin-top:16px;color:var(--t1)}
.ea .ea-p{font-size:13.5px;line-height:19px;color:var(--t2);margin-top:7px;max-width:430px}
.ea .grp{width:430px;margin-top:20px;text-align:left}
.ea .rw{min-height:52px;padding:9px 14px;gap:12px}
.ea-ic{position:relative}
.ea-ic.icone-app .icone{width:84px;height:84px}
.ea-ic.pop-in{animation:popIn calc(.8s*var(--k)) var(--rebond) both}
@keyframes popIn{0%{transform:scale(.55);opacity:0}100%{transform:none;opacity:1}}
.icone.anime .bb{transform-box:fill-box;transform-origin:center;animation:barre 1.15s ease-in-out infinite;animation-delay:calc(var(--i)*-.17s)}
@keyframes barre{0%,100%{transform:scaleY(.62)}35%{transform:scaleY(1.18)}65%{transform:scaleY(.82)}}
.nouv{width:400px;margin-top:20px;text-align:left;display:flex;flex-direction:column;gap:14px}
.nouv>div{display:flex;gap:14px;align-items:center}
.nouv b{display:block;font-size:13.5px;font-weight:600;color:var(--t1)}
.nouv span{display:block;font-size:12.5px;line-height:17px;color:var(--t2);margin-top:1px}
.ea-note{margin-top:auto;padding-bottom:12px;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--t2)}
.ea-note .lien{font-size:11.5px}
.ea-pied{position:absolute;left:0;right:0;bottom:0;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 22px}
.retour{font-size:13.5px;color:var(--t2);font-weight:500;transition:opacity .3s}
.retour.cache{opacity:0}
.points{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:7px}
.points i{width:6px;height:6px;border-radius:3px;background:var(--grp2);transition:width calc(.4s*var(--k)) var(--ressort),background-color .3s}
.points i.fait{background:color-mix(in srgb,var(--bleu) 45%,transparent)}
.points i.ici{width:18px;background:var(--bleu)}
.points.cache{opacity:0}
.cle-l{display:flex;align-items:center;gap:8px;width:430px;margin-top:20px}
.cle-champ{flex:1;height:34px;border-radius:9px;background:var(--champ);box-shadow:inset 0 0 0 1px var(--champ-b);display:flex;align-items:center;padding:0 12px;font:500 13px/1 ui-monospace,"SF Mono",Menlo,monospace;color:var(--t3);gap:8px;transition:box-shadow .3s}
.cle-champ.plein{color:var(--t1);box-shadow:inset 0 0 0 1px var(--champ-b),0 0 0 3px color-mix(in srgb,var(--bleu) 25%,transparent)}
.cle-etat{width:430px;height:24px;margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t2)}
.tourne{width:14px;height:14px;border-radius:50%;border:2px solid var(--grp2);border-top-color:var(--t2);animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
.cle-etat .ok{font-size:12.5px}
.cle-etat .coche{width:18px;height:18px}
/* l'essai */
.es-champ{width:440px;height:76px;margin-top:18px;border-radius:12px;background:var(--champ);box-shadow:inset 0 0 0 1px var(--champ-b);text-align:left;padding:12px 14px;font-size:16px;line-height:22px;color:var(--t1);transition:box-shadow .3s}
.es-champ.ecoute{box-shadow:inset 0 0 0 1px var(--champ-b),0 0 0 3.5px color-mix(in srgb,var(--bleu) 30%,transparent)}
.es-champ .vide{color:var(--t3)}
.caret{display:inline-block;width:1.5px;height:19px;background:var(--bleu);margin-left:1px;vertical-align:-3px;animation:clign 1s steps(1) infinite}
@keyframes clign{50%{opacity:0}}
.es-bas{width:440px;height:62px;margin-top:14px;position:relative}
.es-l{position:absolute;inset:0;display:flex;align-items:center;gap:16px;transition:opacity calc(.3s*var(--k)) ease,transform calc(.5s*var(--k)) var(--ressort)}
.es-ok{opacity:0;transform:translateY(8px);pointer-events:none;justify-content:center}
.reussi .es-l.es-att{opacity:0;transform:translateY(-8px)}
.reussi .es-ok{opacity:1;transform:none}
.es-ok .coche{width:34px;height:34px}
.reussi .es-ok .coche circle{transform:scale(1)}
.reussi .es-ok .coche path{stroke-dashoffset:0;transition-delay:calc(.3s*var(--k))}
.es-ok b{display:block;font-size:15px;font-weight:600;text-align:left}
.es-ok span{display:block;font-size:12.5px;color:var(--t2);text-align:left}
.touche{width:56px;height:50px;border-radius:9px;flex:none;display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;font-size:11px;font-weight:600;color:var(--t2);text-align:left;
  background:linear-gradient(#fff,#f1f1f4);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 2px 0 #c9cad0,0 3px 6px rgba(0,0,0,.12);
  transition:transform calc(.16s*var(--k)) ease,box-shadow calc(.16s*var(--k)) ease}
html[data-theme="sombre"] .touche{background:linear-gradient(#3a3a3d,#2c2c2f);box-shadow:0 0 0 .5px rgba(255,255,255,.12),0 2px 0 #111,0 3px 6px rgba(0,0,0,.4)}
.touche.bas{transform:translateY(2px);box-shadow:0 0 0 1.5px var(--bleu),0 0 0 #c9cad0,0 1px 2px rgba(0,0,0,.12);color:var(--bleu)}
.touche b{font-weight:500;font-size:12.5px;color:var(--t1)}
.touche svg{align-self:flex-end}
.niveau{display:flex;align-items:center;gap:3px;height:40px;flex:1}
.niveau i{flex:1;height:4px;border-radius:2px;background:var(--grp2);transition:height .1s ease,background-color .2s}
.niveau.vif i{background:var(--bleu)}
.es-etat{width:116px;font-size:12.5px;font-weight:500;color:var(--t2);text-align:left}

/* l'alerte de macOS */
.alerte{position:absolute;left:50%;top:150px;width:272px;margin-left:-136px;z-index:40;border-radius:24px;padding:20px 16px 14px;text-align:center;color:var(--t1);
  background:color-mix(in srgb,var(--win) 94%,transparent);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);
  box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 30px 70px -14px rgba(20,30,50,.5),0 8px 20px -8px rgba(20,30,50,.25);
  transition:opacity calc(.2s*var(--k)) ease,transform calc(.45s*var(--k)) var(--ressort)}
.alerte.cache{opacity:0;transform:scale(1.08);pointer-events:none}
.alerte .icone{width:56px;height:56px;margin:0 auto}
.alerte b{display:block;font-size:13px;line-height:17px;font-weight:700;margin-top:8px}
.alerte p{font-size:11.5px;line-height:15px;color:var(--t2);margin-top:5px}
.al-bt{display:flex;gap:8px;margin-top:14px}
.al-bt button{flex:1;height:28px;border-radius:14px;font-size:13px;font-weight:500;background:var(--btn);text-align:center}
.al-bt button.bleu{background:var(--bleu);color:#fff}

/* Réglages Système (le vrai, tout petit) */
.sys{left:calc(50% - 352px);top:150px;width:448px;height:250px;z-index:6;display:flex}
.sys-side{position:absolute;left:7px;top:7px;bottom:7px;width:150px;border-radius:14px;background:var(--side);box-shadow:inset 0 0 0 .5px var(--side-b),inset 0 1px 0 var(--side-hl),0 1px 6px rgba(0,0,0,.05);padding:44px 7px 0}
.sys-side .feux{left:12px;top:12px}
.sys-nav{display:flex;flex-direction:column;gap:1px}
.sys-nav div{height:28px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 7px;font-size:12.5px;color:var(--t1)}
.sys-nav div.on{background:color-mix(in srgb,var(--t1) 9%,transparent);font-weight:500}
.sys-main{position:absolute;left:164px;right:0;top:0;bottom:0;padding:0 16px}
.sys-tb{height:48px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.sys-main p{font-size:11.5px;line-height:15px;color:var(--t2);margin:2px 2px 10px}
.sys-main .rw{min-height:42px}
.sys-main .icone{width:26px;height:26px}

/* menu natif */
.menu{position:absolute;z-index:45;min-width:210px;padding:5px;border-radius:12px;font-size:13px;color:var(--t1);
  background:color-mix(in srgb,var(--win) 86%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  box-shadow:0 0 0 .5px rgba(0,0,0,.22),0 14px 34px -8px rgba(20,30,50,.38);transform-origin:50% 0;
  transition:opacity calc(.16s*var(--k)) ease,transform calc(.3s*var(--k)) var(--ressort)}
.menu.cache{opacity:0;transform:scale(.96);pointer-events:none}
.menu div{height:24px;border-radius:7px;display:flex;align-items:center;padding:0 10px 0 6px;gap:5px;white-space:nowrap}
.menu div .v{width:14px;display:grid;place-items:center;flex:none}
.menu div.sel{background:var(--bleu);color:#fff}
.menu hr{border:0;height:1px;background:var(--sep);margin:4px 8px}

/* ===================== la fenêtre Lucarne ===================== */
.app{left:max(24px,calc(50% - 460px));right:max(24px,calc(50% - 460px));top:44px;bottom:12px;z-index:2}
.side{position:absolute;left:8px;top:8px;bottom:8px;width:212px;border-radius:16px;background:var(--side);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  box-shadow:inset 0 0 0 .5px var(--side-b),inset 0 1px 0 var(--side-hl),0 2px 10px -2px rgba(0,0,0,.08);padding:46px 8px 10px;display:flex;flex-direction:column;z-index:2}
.side .feux{left:14px;top:14px}
.side .champ{margin:0 2px;height:26px;background:color-mix(in srgb,var(--t1) 6%,transparent)}
.moi{display:flex;align-items:center;gap:9px;padding:12px 6px 10px;margin:0 0 4px}
.moi .icone{width:36px;height:36px;flex:none}
.moi b{display:block;font-size:13px;font-weight:600;color:var(--t1)}
.moi span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--t2);margin-top:1px}
.moi span i{width:6px;height:6px;border-radius:50%;background:var(--vert)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{height:30px;border-radius:9px;display:flex;align-items:center;gap:9px;padding:0 6px;font-size:13px;color:var(--t1);transition:background-color .2s,color .2s}
.nav button.on{background:var(--bleu);color:#fff;font-weight:500}
.nav button.on .sq{box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.nav .nb{margin-left:auto;font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums;padding-right:4px}
.nav button.on .nb{color:rgba(255,255,255,.8)}
.nav-sep{height:10px}
.side-pied{margin-top:auto;padding:10px 8px 2px;font-size:11.5px;line-height:15px;color:var(--t2);display:flex;gap:8px;align-items:center}
.fn{display:inline-grid;place-items:center;min-width:20px;height:16px;border-radius:4px;padding:0 4px;background:var(--win);box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 1px 0 rgba(0,0,0,.15);font:600 10px/1 var(--sans);color:var(--t1);vertical-align:1px}
html[data-theme="sombre"] .fn{background:#3a3a3d;box-shadow:0 0 0 .5px rgba(255,255,255,.15),0 1px 0 #000}
.corps{position:absolute;left:228px;right:0;top:0;bottom:0}
.tb{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;z-index:3;
  background:var(--win)}
.tb::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:linear-gradient(var(--win),color-mix(in srgb,var(--win) 0%,transparent));pointer-events:none}
.capsule{height:30px;border-radius:15px;display:flex;align-items:center;background:var(--verre-tb);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 1px 4px rgba(0,0,0,.06),inset 0 .5px 0 rgba(255,255,255,.7)}
html[data-theme="sombre"] .capsule{box-shadow:0 0 0 .5px rgba(255,255,255,.12),0 1px 4px rgba(0,0,0,.3)}
.capsule>span{width:30px;height:30px;display:grid;place-items:center;color:var(--t2)}
.capsule>span.off{color:var(--t3);opacity:.5}
.capsule.txt{padding:0 12px;font-size:12.5px;font-weight:500;color:var(--t2);gap:6px}
.tb h1{font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--t1)}
.tb .esp{flex:1}
.pg{overflow-anchor:none;position:absolute;inset:0;padding:56px 22px 22px 10px;overflow-y:auto;scrollbar-width:none;
  opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity calc(.24s*var(--k)) ease,transform calc(.5s*var(--k)) var(--ressort),visibility 0s calc(.24s*var(--k))}
.pg::-webkit-scrollbar{display:none}
.corps::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;border-radius:0 0 20px 0;background:linear-gradient(color-mix(in srgb,var(--win) 0%,transparent),var(--win));pointer-events:none;z-index:2}
.pg.on{opacity:1;visibility:visible;transform:none;transition:opacity calc(.3s*var(--k)) ease .05s,transform calc(.55s*var(--k)) var(--ressort) .05s,visibility 0s}

/* Aujourd'hui */
.date{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.3px;margin:2px 2px 8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px 4px}
.stats>div{padding:0 12px;position:relative}
.stats>div+div::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--sep)}
.stats span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);font-weight:500}
.stats b{display:block;font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.stats b small{font-size:13px;font-weight:500;color:var(--t2);letter-spacing:0;margin-left:2px}
.graphe{padding:6px 16px 10px}
.graphe .gb{height:38px;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--sep);position:relative}
.graphe .gb i{flex:1;border-radius:3px 3px 1px 1px;background:color-mix(in srgb,var(--bleu) 30%,transparent);transform-origin:bottom;animation:pousse calc(.7s*var(--k)) var(--ressort) both}
.graphe .gb i.now{background:var(--bleu)}
html.fige .graphe .gb i{animation:none}
@keyframes pousse{from{transform:scaleY(0)}}
.graphe .gx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);margin-top:4px;font-variant-numeric:tabular-nums}
.note-t{display:flex;align-items:center;gap:10px;padding:12px 14px 0}
.note-t b{display:block;font-size:13.5px;font-weight:600}
.note-t span{display:block;font-size:11.5px;color:var(--t2);margin-top:1px}
.note-t .chev{margin-left:auto;color:var(--t3)}
.note-p{font-size:13px;line-height:18px;color:var(--t1);padding:9px 14px 0 54px}
.decs{padding:6px 14px 12px 54px;display:flex;flex-direction:column;gap:4px}
.decs div{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--t2)}
.duo{display:grid;grid-template-columns:1.32fr 1fr;gap:14px}
.duo .grp{height:calc(100% - 38px)}
.duo>div{min-width:0}
.fil .rw{min-height:32px;padding:5px 12px;gap:8px}
.fil .rw+.rw::before{left:48px}
.fil .h{width:30px;flex:none;font-size:11.5px;color:var(--t3);font-variant-numeric:tabular-nums}
.fil .x{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fil .x b{font-weight:600}
.note-p{padding-right:16px}

/* Découvrir */
.intro{font-size:13px;line-height:18px;color:var(--t2);margin:0 2px 2px;max-width:520px}
.de .rw{min-height:66px;gap:14px;padding:7px 12px 7px 8px}
.de .rw+.rw::before{left:116px}
.de .lb b{font-weight:600}
.de .rw.ici{background:color-mix(in srgb,var(--bleu) 8%,transparent)}
.de .rw:first-child.ici{border-radius:12px 12px 0 0}.de .rw:last-child.ici{border-radius:0 0 12px 12px}
/* les mini-scènes */
.mini{position:relative;width:92px;height:52px;border-radius:9px;overflow:hidden;flex:none;
  background:radial-gradient(70% 90% at 90% 0%,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),linear-gradient(165deg,#c4d5ea 0%,#dce5ef 50%,#efe3d8 100%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
html[data-theme="sombre"] .mini{background:radial-gradient(70% 90% at 90% 0%,rgba(80,110,150,.5),rgba(80,110,150,0) 60%),linear-gradient(165deg,#24324a 0%,#1d2533 50%,#2a2427 100%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.mini *{position:absolute}
.mn{left:50%;top:0;width:28px;height:7px;margin-left:-14px;background:#000;border-radius:0 0 4px 4px;overflow:hidden}
.mw{background:#fff;border-radius:4px;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 3px 8px -3px rgba(20,30,50,.3)}
html[data-theme="sombre"] .mw{background:#2c2c2f}
.ml{height:2.5px;border-radius:2px;background:#d6d8de}
html[data-theme="sombre"] .ml{background:#4a4a4f}
/* Centre */
.m-centre .mn{animation:mcN 3.6s var(--ressort) infinite}
@keyframes mcN{0%,16%{width:28px;height:7px;margin-left:-14px;border-radius:0 0 4px 4px}30%,74%{width:72px;height:32px;margin-left:-36px;border-radius:0 0 10px 10px}88%,100%{width:28px;height:7px;margin-left:-14px;border-radius:0 0 4px 4px}}
.m-centre .dots{left:50%;top:11px;margin-left:-27px;width:54px;height:10px;animation:mcD 3.6s infinite}
.m-centre .dots i{top:0;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28)}
.m-centre .dots i:nth-child(1){left:0}.m-centre .dots i:nth-child(2){left:14px;background:#ff9f0a}.m-centre .dots i:nth-child(3){left:28px;background:#e8835c}.m-centre .dots i:nth-child(4){left:42px;background:#0a84ff}
@keyframes mcD{0%,30%{opacity:0;transform:translateY(-3px)}38%,70%{opacity:1;transform:none}76%,100%{opacity:0}}
.m-centre .fl{left:62px;top:30px;width:8px;height:12px;animation:mcF 3.6s ease-in-out infinite}
@keyframes mcF{0%{transform:translate(14px,10px)}16%,80%{transform:translate(-10px,-22px)}100%{transform:translate(14px,10px)}}
/* Étagère */
.m-eta .mn{animation:meN 3.4s var(--ressort) infinite}
@keyframes meN{0%,34%{width:28px;margin-left:-14px}44%,60%{width:46px;height:14px;margin-left:-23px;border-radius:0 0 6px 6px}70%,100%{width:42px;height:7px;margin-left:-21px}}
.m-eta .tray{left:50%;top:1.5px;margin-left:-19px;width:5px;height:4px;border:1px solid #fff;border-radius:1px;animation:meT 3.4s infinite}
@keyframes meT{0%,68%{opacity:0}74%,100%{opacity:1}}
.m-eta .doc{left:38px;top:22px;width:11px;height:14px;border-radius:2px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.15);animation:meD 3.4s ease-in-out infinite}
.m-eta .doc::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:2px 2px 0 0;background:#ff3b30}
@keyframes meD{0%,6%{transform:translate(-22px,12px);opacity:0}12%{opacity:1;transform:translate(-22px,12px)}46%{transform:translate(3px,-14px) scale(.8);opacity:1}56%,100%{transform:translate(3px,-20px) scale(.3);opacity:0}}
/* Minuteur */
.m-min .mn{width:58px;height:14px;margin-left:-29px;border-radius:0 0 7px 7px}
.m-min .ring{left:5px;top:3px;width:8px;height:8px}
.m-min .ring circle{fill:none;stroke:#ff9f0a;stroke-width:2;stroke-dasharray:22;animation:mmR 6s linear infinite;transform:rotate(-90deg);transform-origin:center}
@keyframes mmR{from{stroke-dashoffset:0}to{stroke-dashoffset:22}}
.m-min .tx{right:6px;top:2.5px;font-size:7.5px;line-height:9px;font-weight:700;color:#ff9f0a;font-variant-numeric:tabular-nums}
.m-min .pil{left:50%;bottom:7px;margin-left:-30px;width:60px;height:16px;display:flex;gap:3px}
.m-min .pil i{position:relative;flex:1;border-radius:8px;background:rgba(255,255,255,.75);box-shadow:0 0 0 .5px rgba(0,0,0,.12);font-style:normal;font-size:7px;font-weight:700;line-height:16px;text-align:center;color:#3a3a3c}
html[data-theme="sombre"] .m-min .pil i{background:rgba(255,255,255,.14);color:#ddd}
.m-min .pil i:nth-child(2){animation:mmP 6s infinite}
@keyframes mmP{0%,4%{background:#ff9f0a;color:#fff}12%,100%{}}
/* Rappels */
.m-rap .cle{left:9px;bottom:8px;width:17px;height:14px;border-radius:3px;background:#fff;box-shadow:0 1.5px 0 #b9bcc4,0 0 0 .5px rgba(0,0,0,.15);font-size:6px;font-weight:700;color:#55585f;padding:2px 3px;animation:mrC 4s ease-in-out infinite}
@keyframes mrC{0%,6%{transform:none}10%,40%{transform:translateY(1.5px);box-shadow:0 0 0 #b9bcc4,0 0 0 1px #007aff}44%,100%{transform:none}}
.m-rap .bulle{left:30px;bottom:9px;height:12px;border-radius:6px;padding:0 5px;background:rgba(255,255,255,.85);font-size:6px;font-weight:600;line-height:12px;color:#3a3a3c;white-space:nowrap;animation:mrB 4s infinite}
html[data-theme="sombre"] .m-rap .bulle{background:rgba(255,255,255,.16);color:#eee}
@keyframes mrB{0%,10%{opacity:0;transform:translateY(3px)}16%,40%{opacity:1;transform:none}46%,100%{opacity:0}}
.m-rap .mn{animation:mrN 4s var(--ressort) infinite}
@keyframes mrN{0%,44%{width:28px;height:7px;margin-left:-14px;border-radius:0 0 4px 4px}54%,88%{width:70px;height:20px;margin-left:-35px;border-radius:0 0 9px 9px}96%,100%{width:28px;height:7px;margin-left:-14px}}
.m-rap .ban{left:50%;top:5px;margin-left:-29px;width:58px;height:10px;animation:mrV 4s infinite}
.m-rap .ban i{left:0;top:0;width:10px;height:10px;border-radius:50%;background:#ff9f0a}
.m-rap .ban b{left:14px;top:1px;width:40px;height:2.5px;border-radius:2px;background:rgba(255,255,255,.85)}
.m-rap .ban em{left:14px;top:6px;width:26px;height:2.5px;border-radius:2px;background:rgba(255,255,255,.45)}
@keyframes mrV{0%,54%{opacity:0}60%,84%{opacity:1}90%,100%{opacity:0}}
/* Réunions */
.m-reu .mn{width:58px;height:9px;margin-left:-29px;border-radius:0 0 5px 5px}
.m-reu .rd{left:5px;top:2px;width:5px;height:5px;border-radius:50%;background:#ff453a;animation:pouls 1.2s infinite}
@keyframes pouls{50%{opacity:.35}}
.m-reu .tx{right:5px;top:1px;font-size:6px;line-height:7px;font-weight:700;color:#ff8a82;font-variant-numeric:tabular-nums}
.m-reu .mw{left:16px;right:16px;top:15px;height:32px;overflow:hidden}
.m-reu .ph{left:6px;height:3px;display:block;opacity:0;animation:mrP 4.5s infinite}
.m-reu .ph::before{content:"";position:absolute;left:0;top:0;width:8px;height:3px;border-radius:2px;background:var(--q)}
.m-reu .ph::after{content:"";position:absolute;left:11px;top:0;width:var(--w);height:3px;border-radius:2px;background:#d6d8de}
.m-reu .ph:nth-child(1){top:6px}.m-reu .ph:nth-child(2){top:13px;animation-delay:.8s}.m-reu .ph:nth-child(3){top:20px;animation-delay:1.6s}
@keyframes mrP{0%{opacity:0;transform:translateY(2px)}12%,80%{opacity:1;transform:none}92%,100%{opacity:0}}
/* Claude Code */
.m-cla .mn{width:58px;height:9px;margin-left:-29px;border-radius:0 0 5px 5px}
.m-cla .et{left:5px;top:1.2px;width:6.5px;height:6.5px;animation:tourne 4s linear infinite}
.m-cla .tx{right:5px;top:1px;font-size:6px;line-height:7px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.m-cla .mw{left:14px;right:14px;top:16px;height:28px}
.m-cla .mw .ml{left:7px;top:7px;width:44px}
.m-cla .barre{left:7px;right:7px;bottom:7px;height:3px;border-radius:2px;background:#e9e9ee;overflow:hidden}
html[data-theme="sombre"] .m-cla .barre{background:#444}
.m-cla .barre b{left:0;top:0;bottom:0;background:#e8835c;border-radius:2px;animation:mcB 4s ease-in-out infinite}
@keyframes mcB{0%{width:12%}100%{width:96%}}
/* Lucarne déplaçable */
.m-dep .lu{left:32px;top:0;width:28px;height:7px;border-radius:0 0 4px 4px;background:#000;animation:mdL 4.4s var(--ressort) infinite}
@keyframes mdL{
  0%,10%{left:32px;top:0;width:28px;height:7px;border-radius:0 0 4px 4px;background:#000;box-shadow:none}
  18%{left:31px;top:2px;width:30px;height:9px;border-radius:5px;background:#000;box-shadow:0 3px 6px rgba(0,0,0,.3)}
  40%,70%{left:5px;top:5px;width:30px;height:10px;border-radius:5px;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 .7px rgba(255,255,255,.9),0 0 0 .5px rgba(0,0,0,.25),0 3px 6px rgba(0,0,0,.18)}
  86%,100%{left:32px;top:0;width:28px;height:7px;border-radius:0 0 4px 4px;background:#000;box-shadow:none}}
.m-dep .pl{border:1px dashed rgba(0,0,0,.28);border-radius:5px;width:30px;height:10px;animation:mdP 4.4s infinite}
html[data-theme="sombre"] .m-dep .pl{border-color:rgba(255,255,255,.35)}
.m-dep .pl.a{left:5px;top:5px}.m-dep .pl.b{right:5px;top:5px}.m-dep .pl.c{left:5px;bottom:5px}.m-dep .pl.d{right:5px;bottom:5px}
@keyframes mdP{0%,14%{opacity:0}20%,40%{opacity:1}48%,100%{opacity:0}}

/* Réunions */
.reu{display:grid;grid-template-columns:214px 1fr;gap:14px;height:100%}
.reu-l .champ{margin:0 0 8px}
.reu-g{font-size:11.5px;font-weight:600;color:var(--t3);margin:12px 8px 4px}
.reu-r{padding:7px 10px;border-radius:9px;transition:background-color .2s}
.reu-r.sel{background:var(--bleu);color:#fff}
.reu-r b{display:block;font-size:13px;line-height:17px;font-weight:600}
.reu-r span{display:block;font-size:11.5px;line-height:15px;color:var(--t2);margin-top:1px}
.reu-r.sel span{color:rgba(255,255,255,.8)}
.pg[data-pg="reunions"]{overflow:hidden;padding-bottom:0}
.reu-l{overflow:hidden}
.reu-n{min-width:0;overflow-y:auto;scrollbar-width:none;padding-bottom:18px}
.reu-n::-webkit-scrollbar{display:none}
.reu-n h2{font-size:21px;line-height:26px;font-weight:700;letter-spacing:-.3px}
.reu-n .meta{font-size:12px;color:var(--t2);margin-top:3px}
.gens{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.gens span{height:22px;border-radius:11px;padding:0 9px 0 3px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;background:var(--grp)}
.gens i{width:16px;height:16px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-size:8.5px;font-weight:700;display:grid;place-items:center}
.bref{padding:10px 14px;margin-top:12px;font-size:13px;line-height:18px}
.bref em{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--t2);margin-bottom:2px}
.tache{display:flex;align-items:center;gap:10px}
.rond{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--t3);position:relative;transition:box-shadow .2s}
.rond::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--bleu);transform:scale(0);transition:transform calc(.4s*var(--k)) var(--rebond)}
.rond.on{box-shadow:inset 0 0 0 1.5px var(--bleu)}
.rond.on::after{transform:scale(1)}
.tache.faite .lb b{color:var(--t3)}
.n-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.n-cols .gh{margin-top:12px}
.n-cols .rw{min-height:44px}

/* Réglages */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 2px}
.hero .icone{width:64px;height:64px}
.hero b{font-size:17px;font-weight:700;margin-top:6px}
.hero span{font-size:12.5px;line-height:17px;color:var(--t2);margin-top:3px;max-width:400px}
.reg .rw{min-height:44px}
.reg .gh{gap:7px;align-items:center}

/* ===================== l'îlot ===================== */
.calque{position:absolute;left:calc(50% - 500px);top:0;width:1000px;height:360px;pointer-events:none}
#forme-svg{z-index:30}
#contenu{z-index:31}
#encoche-svg{z-index:32}
.c{position:absolute;color:#fff;white-space:nowrap;text-align:left;font-family:var(--sans)}

/* ===================== forme de l'îlot (reprise de ilot-centre.html) ===================== */
const PORTEE = 1.6, POIGNEE = 0.18;
function cote(g, n, bw){
  const corps = Math.max(0, g.h - B), u = Math.min(corps, 40) / 40, e = 1 - Math.pow(1 - u, 2.5);
  const d = Math.max(0, bw - n) * e, W = n + d, serre = 1 - clamp((n - HC) / 24, 0, 1);
  const rs = g.rs + (4 - g.rs) * serre, rbv = lerp(g.rb + (8 - g.rb) * serre, g.rb, clamp(corps / 12, 0, 1));
  const fe = Math.max(0, Math.min(g.f, d * 0.45, B - rs - 2, corps * 0.6));
  const rte = Math.max(0, Math.min(g.rt, (d - fe) / PORTEE, corps / 3.2));
  const lam = Math.min(1, d / 6), dispo = (1 - lam) * (g.h - rs) + lam * (g.h - B - PORTEE * rte);
  const rbe = Math.max(0, Math.min(rbv, dispo / PORTEE, W / PORTEE));
  return {n, W, d, fe, rte, rbe, rs};
}
function chemin(g){
  const h = g.h, L = cote(g, g.ng, g.bw), D = cote(g, g.nd, g.bd), X = f2, Y = f2;
  const a1 = PORTEE * L.rte, c1 = POIGNEE * a1, a2 = PORTEE * L.rbe, c2 = POIGNEE * a2;
  const b1 = PORTEE * D.rte, d1 = POIGNEE * b1, b2 = PORTEE * D.rbe, d2 = POIGNEE * b2;
  let p = `M${X(-L.n - L.rs)} ${Y(-1)}L${X(-L.n - L.rs)} 0Q${X(-L.n)} 0 ${X(-L.n)} ${Y(L.rs)}`;
  if (L.d > 0.5) p += `L${X(-L.n)} ${Y(B - L.fe)}Q${X(-L.n)} ${B} ${X(-L.n - L.fe)} ${B}L${X(-L.W + a1)} ${B}C${X(-L.W + c1)} ${B} ${X(-L.W)} ${Y(B + c1)} ${X(-L.W)} ${Y(B + a1)}`;
  p += `L${X(-L.W)} ${Y(h - a2)}C${X(-L.W)} ${Y(h - c2)} ${X(-L.W + c2)} ${Y(h)} ${X(-L.W + a2)} ${Y(h)}`;
  p += `L${X(D.W - b2)} ${Y(h)}C${X(D.W - d2)} ${Y(h)} ${X(D.W)} ${Y(h - d2)} ${X(D.W)} ${Y(h - b2)}`;
  if (D.d > 0.5) p += `L${X(D.W)} ${Y(B + b1)}C${X(D.W)} ${Y(B + d1)} ${X(D.W - d1)} ${B} ${X(D.W - b1)} ${B}L${X(D.n + D.fe)} ${B}Q${X(D.n)} ${B} ${X(D.n)} ${Y(B - D.fe)}`;
  p += `L${X(D.n)} ${Y(D.rs)}Q${X(D.n)} 0 ${X(D.n + D.rs)} 0L${X(D.n + D.rs)} ${Y(-1)}Z`;
  return p;
}
const CLES = ['ng', 'nd', 'bw', 'bd', 'h', 'rs', 'rb', 'rt', 'f'];
const REPOS = {ng:HC, nd:HC, bw:HC, bd:HC, h:B, rs:4, rb:8, rt:0, f:0};

class Ressort{
  constructor(x){ this.x = x; this.v = 0; this.cible = x; this.futur = null; this.attente = 0; this.rep = .45; this.z = .8; }
  viser(c, rep, z, attente){
    if (attente > 0){ this.futur = {c, rep, z}; this.attente = attente; return; }
    this.futur = null; this.attente = 0; this.cible = c; this.rep = rep; this.z = z;
  }
  poser(c){ this.x = c; this.v = 0; this.cible = c; this.futur = null; this.attente = 0; }
  pas(dt){
    if (this.attente > 0){ this.attente -= dt; if (this.attente <= 0 && this.futur){ const f = this.futur; this.futur = null; this.cible = f.c; this.rep = f.rep; this.z = f.z; } }
    const w = 2 * Math.PI / this.rep, a = w * w * (this.cible - this.x) - 2 * this.z * w * this.v;
    this.v += a * dt; this.x += this.v * dt;
  }
  pose(){
    if (this.attente > 0) return false;
    if (Math.abs(this.x - this.cible) < 0.01 && Math.abs(this.v) < 0.05){ this.x = this.cible; this.v = 0; return true; }
    return false;
  }
}

let jeton = 0, instant = false, enCoursN = 0, cibleN = 0, auto = false;
const minuteries = new Set();

}

const facile = u => 1 - Math.pow(1 - u, 3);
const doux = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

const R = {}; CLES.forEach(k => R[k] = new Ressort(REPOS[k]));
const TOUS = CLES.map(k => R[k]);
let cible = {...REPOS}, enCours = false, tPrec = 0;
function ilot(g, o = {}){
  const grand = (g.bw + g.bd) * g.h >= (cible.bw + cible.bd) * cible.h - .5;
  const rep = o.rep ?? (grand ? .46 : .38), z = o.z ?? (grand ? .78 : 1), att = o.attente ?? (grand ? 0 : .06);
  cible = {...g};
  for (const k of CLES){ if (instant) R[k].poser(g[k]); else { const haut = k === 'h' && grand; R[k].viser(g[k], haut ? rep * 1.06 : rep, z, att + (haut ? .02 : 0)); } }

}

const CAP_PLACES = () => ({hg:{x:16, y:B + 10, w:128, h:36}, hd:{x:W() - 144, y:B + 10, w:128, h:36}, g:{x:12, y:H() / 2 - 64, w:36, h:128}, d:{x:W() - 48, y:H() / 2 - 64, w:36, h:128}, bg:{x:16, y:H() - 52, w:128, h:36}, bd:{x:W() - 144, y:H() - 52, w:128, h:36}});
places.innerHTML = Object.keys(CAP_PLACES()).map(k => `<div class="place" data-pl="${k}"></div>`).join('');
function posePlaces(){ const P = CAP_PLACES(); $$('.place').forEach(p => { const g = P[p.dataset.pl]; Object.assign(p.style, {left:g.x + 'px', top:g.y + 'px', width:g.w + 'px', height:g.h + 'px'}); }); }
function cap(g, cls){
  if (cls !== undefined) capsule.className = cls;
  capsule.style.transform = `translate(${f2(g.x)}px,${f2(g.y)}px)`;
  capsule.style.width = g.w + 'px'; capsule.style.height = g.h + 'px';
  capsule.style.borderRadius = g.r || (Math.min(g.w, g.h) / 2) + 'px';
}
const CAP_ENC = () => ({x:XR(-HC), y:0, w:HC * 2, h:B, r:'0 0 12px 12px'});

/* ----- « Essayer » : la vraie encoche fait la démonstration ----- */
async function essayer(k){
  st.essai = k; majApp();
  if (k === 'centre'){ ilot(bandeau(232, HCENTRE, 154)); montre(['centre'], .16); await attendre(1.4); return; }
  if (k === 'etagere'){ ilot(compact(132, HC)); montre(['etaG'], .14); }
  else if (k === 'minuteur'){ ilot(compact(132, 132)); montre(['minG', 'minD'], .12); }
  else if (k === 'rappels'){ ilot(bandeau(190, B + 62, 150)); montre(['rappel'], .16); }
  else if (k === 'reunions'){ ilot(compact(132, 132)); montre(['recG', 'recD'], .12); }
  else if (k === 'claude'){ ilot(compact(132, 132)); montre(['clG', 'clD'], .12); }
  await attendre(2.4); if (!fin()){ montre([], 0); ilot(REPOS); st.essai = null; majApp(); }
}
function fermerIlot(){ montre([], 0); ilot(REPOS); $('#min10').classList.remove('sv'); }
async function deplacer(){
  posePlaces();
  const [nx, ny] = [XR(0), B / 2 + 2];
  await va(nx, ny, .9);
  anneau.style.left = nx + 'px'; anneau.style.top = ny + 'px';
  anneau.classList.add('vu'); void anneau.offsetWidth; anneau.classList.add('plein'); pointeur.classList.add('appui');
  await attendre(.45);
  anneau.classList.remove('vu', 'plein');
  // elle se décolle : 4 % plus grande, une ombre, noire encore
  cap(CAP_ENC(), 'vu'); void capsule.offsetWidth;
  const T = {x:nx - 64, y:ny - 6, w:128, h:36};
  cap(T, 'vu tenue montre');
  places.classList.add('vu');
  await attendre(.35);
  // on la glisse vers le coin en haut à gauche
  const P = CAP_PLACES().hg, x0 = nx, y0 = ny, x1 = P.x + 70, y1 = P.y + 22;
  if (!instant){ capsule.style.transition = 'transform 0s,width .4s,height .4s,border-radius .4s,background-color .45s,box-shadow .45s'; pointeur.style.transition = 'none'; }
  await tween(1, u => {
    const e = doux(u), x = lerp(x0, x1, e), y = lerp(y0, y1, e) - Math.sin(u * Math.PI) * 26;
    pointeur.style.transform = `translate(${f2(x)}px,${f2(y)}px)`; px = x; py = y;
    capsule.style.transform = `translate(${f2(x - 64)}px,${f2(y - 18 + 12 * (1 - e))}px) scale(1.04)`;
    if (u > .6) $('[data-pl="hg"]').classList.add('proche');
  });
  capsule.style.transition = '';
  pointeur.classList.remove('appui');
  // on lâche : elle file à sa place, devient du verre
  cap(P, 'vu verre montre');
  places.classList.remove('vu');
  await attendre(.5);
  $('[data-pl="hg"]').classList.remove('proche');
  await va(XR(-40), 260, .8);
}
async function rentrer(){

}

const N = ETAPES.length;
const PAUSES = [1.6, 1.4, 1.4, 1.4, 1.4, 2, 2, 2.2, 2, 2, 2, 3.2];

/* ===================== régie ===================== */
let etape = 0;
const fr = t => t.replace(/ ([:»?!;])/g, ' $1').replace(/« /g, '« ');
$('#pas').innerHTML = ETAPES.map((e, i) => `<li><button data-e="${i + 1}"><span>${i + 1}</span>${fr(e.c)}</button></li>`).join('');
function nbsp(racineEl){
  const w = document.createTreeWalker(racineEl, NodeFilter.SHOW_TEXT);
  for (let n; (n = w.nextNode());) if (/ [:»?!;]|« /.test(n.nodeValue)) n.nodeValue = fr(n.nodeValue);
}
function majRegie(n){
  etape = n;
  const m = Math.max(1, n), e = ETAPES[m - 1];
  $('#num').textContent = `Lucarne · direction A, app système Apple · étape ${m} sur ${N}`;
  $('#titre').textContent = fr(e.t); $('#phrase').textContent = fr(e.p);
  $$('#pas button').forEach(b => b.classList.toggle('ici', +b.dataset.e === m));
}
async function poser(n){
  annuler();
  instant = true; racine.classList.add('snap');
  try { cibleN = n; enCoursN = 0; init(); for (let i = 1; i <= n; i++){ enCoursN = i; await ETAPES[i - 1].jeu(); } }
  finally { instant = false; }
  majRegie(n); rendu(); nbsp(ecran);
  void ecran.offsetWidth;
  requestAnimationFrame(() => requestAnimationFrame(() => racine.classList.remove('snap')));
}
async function jouer(n){
  majRegie(n);
  if (REDUIT) return poser(n);
  racine.classList.remove('snap'); void ecran.offsetWidth;
  cibleN = 0; enCoursN = n;
  await ETAPES[n - 1].jeu();
}
function arreter(){ jeton++; auto = false; annuler(); }
const autoCase = $('#autoCase');
async function tourner(){
  arreter(); const j = jeton; auto = true;
  try {
    await poser(0); await attendre(.9);
    for (;;){
      for (let n = 1; n <= N; n++){ await jouer(n); await attendre(PAUSES[n - 1]); }
      if (!autoCase.checked) break;
      ecran.style.opacity = 0; await attendre(.3);
      await poser(0); ecran.style.opacity = 1; await attendre(1.0);
    }
  } catch (e){ if (e !== 'stop') console.error(e); }
  ecran.style.opacity = 1;
  if (j === jeton) auto = false;
}
function lance(n){ arreter(); ecran.style.opacity = 1; poser(n - 1).then(() => jouer(n)).catch(e => { if (e !== 'stop') console.error(e); }); }
$('#rejouer').addEventListener('click', () => { if (autoCase.checked) tourner(); else lance(Math.max(1, etape)); });
$('#suivant').addEventListener('click', () => { autoCase.checked = false; lance(etape >= N ? 1 : etape + 1); });
$('#pas').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; autoCase.checked = false; lance(+b.dataset.e); });
autoCase.addEventListener('change', () => { if (autoCase.checked) tourner(); else arreter(); });
function ralenti(oui){ K = oui ? 4 : 1; racine.style.setProperty('--k', K); $('#lentCase').checked = oui; }
$('#lentCase').addEventListener('change', e => ralenti(e.target.checked));
$('#themeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; themeChoisi = b.dataset.t; theme(themeChoisi, true); });

/* ===================== à la main : la vraie souris ===================== */
function aLaMain(){ if (auto || autoCase.checked){ autoCase.checked = false; arreter(); } pointeur.classList.remove('vu'); }
ecran.addEventListener('click', e => {
  if (FIGE) return;
  const pgB = e.target.closest('[data-page]'), es = e.target.closest('[data-essayer]'), s = e.target.closest('.pg .sw'), r = e.target.closest('.rond');
  if (!pgB && !es && !s && !r) return;
  aLaMain();
  if (pgB && F.app.classList.contains('cache') === false) page(pgB.dataset.page);
  else if (s) s.classList.toggle('on');
  else if (r) r.classList.toggle('on');
  else if (es){ fermerIlot(); capsule.className = ''; const k = es.dataset.essayer; if (k === 'deplacer'){ st.essai = k; majApp(); deplacer().catch(() => {}); } else essayer(k).catch(() => {}); }
});

/* ===================== démarrage ===================== */
nbsp(ecran);
theme(themeChoisi);
if (Q.has('lent')) ralenti(true);
const e0 = clamp(+(Q.get('etape') || 0), 0, N);
if (FIGE){ autoCase.checked = false; poser(e0).catch(() => {}); }
// une image figée se recalcule si la fenêtre change de taille (le pointeur vise les vraies positions)
if (FIGE) addEventListener('resize', () => { poser(etape).catch(() => {}); });
else if (Q.has('joue') && e0 >= 1){ autoCase.checked = false; poser(e0 - 1).then(() => setTimeout(() => jouer(e0).catch(() => {}), 400)); }
else setTimeout(() => tourner(), 300);
window.lucarne = {poser, jouer, st:() => st};
</script>
